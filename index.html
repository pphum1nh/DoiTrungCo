<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0807">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Đời Trung Cổ">
<meta name="description" content="Game mô phỏng cuộc đời Trung cổ giả tưởng.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>[hidden]{display:none!important}html,body{margin:0;background:#0b0807}</style>
<title>Đời Trung Cổ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,600;1,400&family=Philosopher:wght@400;700&display=swap">
<style>
/* Layout: RPG HUD — portrait plate on top, stat strip, chronicle panel with a glowing "next year" orb, hotbar at bottom. Overlays are framed bronze panels. One dark world by design. */
:root{
  --bg:#0b0807; --panel:#1d1612; --panel-2:#130e0b; --slot:#0f0b09;
  --edge:#5b3f2b; --edge-2:#8a6142; --copper:#c88d59; --title:#efd3a3;
  --text:#e7dbc4; --muted:#a69479; --gold:#eaa93c; --good:#86c95e; --bad:#d65a42; --arcane:#a283f2;
  --r0:#d9d0c0; --r1:#5aa2ff; --r2:#b97ff7; --r3:#ff9b2f;
  --f-ui:'Philosopher','Trebuchet MS',sans-serif;
  --f-text:'Alegreya',Georgia,'Times New Roman',serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background-color:var(--bg);background-image:radial-gradient(120% 70% at 50% 0%,#2c1f16 0%,#120d0a 55%,#080605 100%);color:var(--text);font-family:var(--f-text);font-size:16px;line-height:1.45;overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;gap:14px;max-width:620px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 8px}

/* bronze panel */
.panel{position:relative;background:linear-gradient(180deg,#231a15,#15100d);border:1px solid var(--edge);border-radius:3px;box-shadow:inset 0 0 0 1px #000,inset 0 0 0 3px #2b2019,inset 0 0 0 4px rgb(138 97 66 / .45),0 10px 30px rgb(0 0 0 / .55)}
.panel::before,.panel::after{content:"";position:absolute;width:14px;height:14px;border:2px solid var(--copper);pointer-events:none;opacity:.85}
.panel::before{top:-2px;left:-2px;border-right:0;border-bottom:0}
.panel::after{bottom:-2px;right:-2px;border-left:0;border-top:0}
.plate{position:relative;background:linear-gradient(#2d221b,#16100c);border:1px solid var(--edge-2);box-shadow:inset 0 0 0 1px #000,0 3px 8px #000;padding:4px 22px 5px}
.plate::before,.plate::after{content:"";position:absolute;top:50%;width:8px;height:8px;background:var(--copper);transform:translateY(-50%) rotate(45deg)}
.plate::before{left:-5px}.plate::after{right:-5px}
.plate h2,.plate span{display:block;font:700 1.3rem/1.15 var(--f-ui);color:var(--title);margin:0;text-align:center;text-shadow:0 1px 0 #000,0 0 16px rgb(234 169 60 / .25);text-wrap:balance}
.plate.sm{padding:2px 16px 3px}.plate.sm span{font-size:.95rem}

/* HUD */
.hud{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px}
.por{position:relative;width:72px;height:72px}
.ring{width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 50% 35%,#2a3a5c,#0b0f1c 70%);border:2px solid var(--edge-2);box-shadow:0 0 0 3px #0c0907,0 0 0 4px var(--edge),inset 0 0 14px #000;overflow:hidden}
.ring svg{width:100%;height:100%;display:block}
.lvl{position:absolute;right:-7px;top:-5px;min-width:30px;height:30px;padding:0 4px;border-radius:15px;background:radial-gradient(#3a2a20,#120c09);border:2px solid var(--copper);font:700 .82rem/26px var(--f-ui);color:var(--title);text-align:center;font-variant-numeric:tabular-nums}
.hudmain{min-width:0}
.hudmain h1{font:700 1.2rem/1.1 var(--f-ui);color:var(--title);margin:0;text-shadow:0 1px 0 #000,0 0 14px rgb(234 169 60 / .2);overflow-wrap:anywhere}
.hudmain .sub{margin:2px 0 2px;font:.8rem/1.25 var(--f-ui);color:var(--muted)}
.hb{position:relative;height:15px;background:#0a0706;border:1px solid #3b2a1f;box-shadow:inset 0 1px 3px #000;margin-top:4px;border-radius:2px;overflow:hidden}
.hb i{position:absolute;inset:0 auto 0 0;transition:width .4s ease}
.hb.hp i{background:linear-gradient(#e8513f,#8a1a12)}
.hb.mp i{background:linear-gradient(#5a8ff0,#1c3c86)}
.hb span{position:relative;display:block;text-align:center;font:700 .64rem/15px var(--f-ui);color:#fff;text-shadow:0 1px 1px #000;letter-spacing:.05em;font-variant-numeric:tabular-nums}
.hudside{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.gold{display:flex;align-items:center;gap:5px;font:700 .95rem var(--f-ui);color:var(--gold);font-variant-numeric:tabular-nums;white-space:nowrap}
.gold.debt{color:var(--bad)}
.ib{width:36px;height:36px;display:grid;place-items:center;background:linear-gradient(#211813,#0e0a08);border:1px solid var(--edge);box-shadow:inset 0 0 8px #000;color:var(--copper);cursor:pointer;border-radius:2px}
.ib:hover{border-color:var(--copper)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;padding:8px 6px}
.st{text-align:center;padding:2px;min-width:0}
.st span{display:block;font:.6rem var(--f-ui);color:var(--muted);letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st b{display:block;font:700 1.05rem/1.2 var(--f-ui);font-variant-numeric:tabular-nums}
.mb{height:3px;background:#0a0706;margin:2px 6px 0;overflow:hidden}
.mb i{display:block;height:100%;background:var(--copper);transition:width .4s}
.mb i.low{background:var(--bad)}.mb i.high{background:var(--good)}

/* chronicle */
.chronp{flex:1;min-height:0;display:flex;flex-direction:column}
.chead{display:flex;justify-content:center;margin-top:-13px;position:relative;z-index:1}
.chron{flex:1;min-height:0;overflow-y:auto;padding:10px 14px 96px}
.yr{margin-bottom:14px}
.yr h3{font:700 1rem var(--f-ui);color:var(--copper);margin:0 0 4px;display:flex;gap:10px;align-items:baseline}
.yr h3 span{font-size:.7rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.yr p{margin:0 0 4px;padding-left:12px;border-left:2px solid #3a2a1f}
.yr p.good{border-color:var(--good)}.yr p.bad{border-color:var(--bad)}.yr p.magic{border-color:var(--arcane)}.yr p.item{border-color:var(--gold)}
.yr:first-child p:first-of-type::first-letter{font:700 2.5em/.85 var(--f-ui);color:var(--gold);float:left;margin:3px 6px 0 0}
.agebtn{position:absolute;right:14px;bottom:14px;width:80px;height:80px;border-radius:50%;background:radial-gradient(circle at 50% 36%,#ffc066 0%,#d4600f 36%,#4a1606 74%);border:3px solid #2a150b;box-shadow:0 0 0 2px var(--gold),0 0 24px rgb(255 120 30 / .5),inset 0 0 18px rgb(0 0 0 / .6);color:#fff3dc;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font:700 .72rem/1.1 var(--f-ui);text-shadow:0 1px 2px #000;cursor:pointer;animation:glow 2.6s ease-in-out infinite;z-index:2}
.agebtn small{font-size:.62rem;opacity:.9}
.agebtn:disabled{filter:grayscale(1) brightness(.55);animation:none;cursor:not-allowed}
@keyframes glow{50%{box-shadow:0 0 0 2px var(--gold),0 0 36px rgb(255 140 40 / .8),inset 0 0 18px rgb(0 0 0 / .6)}}

/* hotbar */
.hot{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;padding:8px 6px}
.hk{position:relative;height:58px;background:radial-gradient(circle at 50% 35%,#231a14,#0c0907 75%);border:1px solid var(--edge);box-shadow:inset 0 0 10px #000;border-radius:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--copper);cursor:pointer;min-width:0}
.hk:hover{border-color:var(--copper);color:var(--title)}
.hk span{font:700 .56rem var(--f-ui);letter-spacing:-.01em;color:var(--text);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.hk kbd{position:absolute;top:2px;right:4px;font:700 .55rem var(--f-ui);color:var(--muted)}

/* overlays */
.veil{position:fixed;inset:0;z-index:20;background:rgb(4 3 2 / .74);display:flex;align-items:flex-end;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(8px,env(safe-area-inset-right,0px)) 0 max(8px,env(safe-area-inset-left,0px))}
.veil.mid{align-items:center;overflow-y:auto;padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
.sheet{width:100%;max-width:620px;max-height:90%;display:flex;flex-direction:column;border-bottom:0;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(26px);opacity:.4}}
.shead{position:relative;display:flex;justify-content:center;align-items:center;padding:14px 56px 8px;min-height:58px}
.xbtn,.bk{position:absolute;top:14px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;border-radius:2px}
.xbtn{right:12px;background:linear-gradient(#a3342a,#5e130d);border:1px solid #c45a45;box-shadow:inset 0 0 0 1px #2a0604,0 2px 4px #000;color:#f8dccf}
.bk{left:12px;background:linear-gradient(#2a1f19,#120d0a);border:1px solid var(--edge-2);color:var(--copper)}
.sbody{overflow-y:auto;padding:4px 14px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 12px;background:linear-gradient(#1a130f,#0f0b09);border:1px solid #3e2c21;box-shadow:inset 0 0 8px rgb(0 0 0 / .6);text-align:left;width:100%;border-radius:2px}
button.row{cursor:pointer}
button.row:hover:not(:disabled){border-color:var(--copper)}
button.row:disabled{opacity:.45;cursor:not-allowed}
.row>div{min-width:0;flex:1}
.row b{display:block;font:700 .98rem var(--f-ui);color:var(--title)}
.row small{display:block;color:var(--muted);font-size:.82rem}
.tag{flex:none;font:700 .8rem var(--f-ui);color:var(--gold);font-variant-numeric:tabular-nums;text-align:right}
.bond{height:4px;background:#0a0706;margin-top:5px;overflow:hidden}
.bond i{display:block;height:100%;background:var(--good)}
.sec{display:flex;align-items:center;gap:10px;font:700 .68rem var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--copper);margin:10px 0 0}
.sec::before,.sec::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--edge-2),transparent)}
.note{margin:0;padding:10px 12px;background:#100b09;border:1px solid #33251c;border-left:3px solid var(--copper)}
.note.good{border-left-color:var(--good)}.note.bad{border-left-color:var(--bad)}.note.magic{border-left-color:var(--arcane)}.note.item{border-left-color:var(--gold)}

/* cards */
.card{width:100%;max-width:470px;margin:auto;padding-bottom:18px;animation:up .2s ease-out}
.cbody{padding:4px 18px 0}
.cbody>p{margin:0 0 8px}
.eyebrow{font:700 .68rem var(--f-ui)!important;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.btn{background:linear-gradient(#2c211a,#140f0c);border:1px solid var(--edge-2);box-shadow:inset 0 0 0 1px #000;padding:11px 14px;border-radius:2px;font:700 .95rem var(--f-ui);color:var(--text);text-align:left;cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--gold);color:var(--title)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.pri{background:linear-gradient(#b8682c,#6a2c0d);border-color:#e3a061;color:#fff3e0;text-align:center;text-shadow:0 1px 1px #000}
.btn.sm{padding:8px 12px;font-size:.85rem;flex:none}
.card.epic{max-width:500px;border-color:var(--gold);box-shadow:inset 0 0 0 1px #000,inset 0 0 0 3px #2b2019,inset 0 0 0 4px rgb(234 169 60 / .5),0 0 70px rgb(234 120 30 / .25),0 10px 30px rgb(0 0 0 / .6);animation:epic .45s cubic-bezier(.2,1.3,.4,1)}
@keyframes epic{from{transform:scale(.86);opacity:0}}
.card.epic .cbody{padding-top:24px;text-align:center}
.card.epic .choices{text-align:left}
.medal{width:108px;height:108px;margin:0 auto 10px;border-radius:50%;display:grid;place-items:center;border:3px solid #1a0e08;color:#fff6e3}
.big{font:700 1.9rem/1.08 var(--f-ui);color:var(--title);margin:2px 0 10px;text-transform:uppercase;letter-spacing:.03em;text-shadow:0 2px 0 #000,0 0 22px rgb(234 169 60 / .35);text-wrap:balance}
.fl{display:block;font:700 .68rem var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--copper);margin:14px 0 6px!important}
.nmrow{display:flex;gap:8px}
.nmrow input{flex:1;min-width:0;background:#0d0a08;border:1px solid var(--edge);box-shadow:inset 0 0 8px #000;padding:10px 12px;color:var(--title);font:700 1rem var(--f-ui);border-radius:2px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opt{background:linear-gradient(#1b1410,#0e0a08);border:1px solid #3e2c21;padding:9px 11px;cursor:pointer;text-align:left;font:700 .9rem var(--f-ui);color:var(--title);border-radius:2px}
.opt small{display:block;font:400 .76rem/1.3 var(--f-text);color:var(--muted);margin-top:2px}
.opt.on{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold),0 0 12px rgb(234 169 60 / .2)}
.dates{font:700 1.2rem var(--f-ui);color:var(--muted);margin:0 0 6px}
.sum{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:12px auto;font-size:.92rem;text-align:left;max-width:320px}
.sum dt{color:var(--muted);font-family:var(--f-ui)}.sum dd{margin:0;font-variant-numeric:tabular-nums}
.epi{font-style:italic;color:var(--gold);border-top:1px solid var(--edge);padding-top:10px}

/* inventory */
.bag{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.slot{aspect-ratio:1;max-width:100%;background:radial-gradient(circle at 50% 40%,#1d1511,#0a0706);border:1px solid #3a2a1f;box-shadow:inset 0 0 12px #000;display:grid;place-items:center;cursor:pointer;position:relative;border-radius:2px}
.slot svg{width:56%;height:56%}
.slot.empty{cursor:default}
.slot.r0{color:var(--r0)}
.slot.r1{color:var(--r1);border-color:#33598f;box-shadow:inset 0 0 14px rgb(90 162 255 / .22)}
.slot.r2{color:var(--r2);border-color:#664492;box-shadow:inset 0 0 14px rgb(185 127 247 / .25)}
.slot.r3{color:var(--r3);border-color:#94561c;box-shadow:inset 0 0 16px rgb(255 155 47 / .3)}
.slot.sel{outline:2px solid var(--gold);outline-offset:1px}
.slot .q{position:absolute;bottom:2px;right:4px;font:700 .6rem var(--f-ui);color:var(--muted)}
.tip{padding:12px 14px;background:linear-gradient(#1c1511,#0f0b09);border:1px solid var(--edge-2);box-shadow:inset 0 0 0 1px #000}
.tip h4{margin:0;font:700 1.1rem var(--f-ui)}
.tip .rk{font:700 .65rem var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tip ul{margin:6px 0;padding:0;list-style:none;font:.9rem var(--f-ui);color:var(--good)}
.tip ul li.neg{color:var(--bad)}
.tip p{margin:4px 0;font-size:.88rem;color:var(--muted)}
.tip .acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.c-r0{color:var(--r0)}.c-r1{color:var(--r1)}.c-r2{color:var(--r2)}.c-r3{color:var(--r3)}

/* house & tree */
.house{display:flex;gap:14px;align-items:center}
.house>div{min-width:0}
.house h3{margin:0;font:700 1.3rem var(--f-ui);color:var(--title)}
.house i{color:var(--gold);font-size:.9rem}
.hgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.hgrid div{padding:8px 10px;background:#0f0b09;border:1px solid #33251c}
.hgrid span{display:block;font:700 .62rem var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.hgrid b{font:700 .98rem var(--f-ui);color:var(--title)}
.tree{display:flex;flex-direction:column}
.troot{text-align:center;font:.82rem var(--f-ui);color:var(--muted);padding:8px;border:1px dashed #3e2c21}
.tnode{position:relative;background:linear-gradient(#1b1410,#0f0b09);border:1px solid var(--edge);padding:10px 12px;margin-top:22px}
.tnode::before{content:"";position:absolute;left:50%;top:-23px;width:2px;height:22px;background:var(--copper);transform:translateX(-50%)}
.tree>.tnode:first-child{margin-top:0}.tree>.tnode:first-child::before{display:none}
.tnode.cur{border-color:var(--gold);box-shadow:0 0 18px rgb(234 169 60 / .18)}
.tgen{font:700 .64rem var(--f-ui);color:var(--copper);text-transform:uppercase;letter-spacing:.14em}
.tnode b{display:block;font:700 1.05rem var(--f-ui);color:var(--title)}
.tnode small{display:block;color:var(--muted);font-size:.82rem}
.tkids{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.kid{font:.78rem var(--f-ui);padding:2px 8px;border:1px solid #3e2c21;background:#0c0907}
.kid.heir{border-color:var(--gold);color:var(--gold)}
.kid.dead{text-decoration:line-through;color:var(--muted)}
.kid.none{color:var(--muted)}
.nmline{display:flex;align-items:center;gap:6px;min-width:0}
.hcrest{flex:none;background:none;border:0;padding:0;cursor:pointer;line-height:0}
.ri{flex:none;width:42px;height:42px;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#231a14,#0a0706 75%);border:1px solid #3a2a1f;box-shadow:inset 0 0 8px #000;color:var(--copper);border-radius:2px}
.row,.tip,.note{box-sizing:border-box}
.dom{display:flex;flex-direction:column;gap:10px;padding:12px;background:linear-gradient(#1c1511,#0f0b09);border:1px solid var(--edge-2);box-shadow:inset 0 0 0 1px #000}
.domh{display:flex;gap:12px;align-items:center}.domh>div{min-width:0}
.domh b{display:block;font:700 1.1rem var(--f-ui);color:var(--title)}.domh small{color:var(--muted);font-size:.82rem}
.satlab{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font:700 .72rem var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.satlab b{font-size:.9rem;letter-spacing:0;text-transform:none}
.satbar small{display:block;color:var(--muted);font-size:.78rem;margin-top:4px}
.sb{position:relative;height:12px;background:#0a0706;border:1px solid #3b2a1f;margin-top:5px;border-radius:2px}
.sb i{position:absolute;inset:0 auto 0 0;transition:width .4s}
.sb em{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--title);transform:translateX(-1px);box-shadow:0 0 4px #000}
.sb u{position:absolute;top:0;bottom:0;width:1px;background:rgb(214 90 66 / .7)}
.s0{color:var(--bad)}.s1{color:var(--gold)}.s2{color:var(--good)}
i.s0{background:linear-gradient(#e0614a,#8a1f12)}i.s1{background:linear-gradient(#f0b54a,#9a6512)}i.s2{background:linear-gradient(#93d06a,#3b7a22)}
.satpill{display:inline-block;min-width:34px;padding:2px 6px;border:1px solid currentColor;border-radius:10px;text-align:center;font:700 .74rem var(--f-ui)}
.ri.foe{color:#e0705a;border-color:#6a2a1f}
.bond.hate i{background:var(--bad)}
.ri.r1{color:var(--r1);border-color:#33598f}.ri.r2{color:var(--r2);border-color:#664492}.ri.r3{color:var(--r3);border-color:#94561c}.ri.r0{color:var(--r0)}
button.row:hover:not(:disabled) .ri{color:var(--title);border-color:var(--copper)}
.evimg{position:relative;margin:4px 4px 0;aspect-ratio:3/2;max-width:calc(100% - 8px);overflow:hidden;border-bottom:1px solid var(--gold);background:#0a0706}
.evimg img{display:block;width:100%;height:100%;object-fit:cover;animation:kb 9s ease-out both}
.evimg::after{content:"";position:absolute;inset:auto 0 0;height:45%;background:linear-gradient(transparent,#1d1612)}
@keyframes kb{from{transform:scale(1.08)}}
.card.has-img{max-width:560px}
.card.has-img .cbody{padding-top:0}
.card.has-img .medal{width:70px;height:70px;margin:-38px auto 6px;position:relative;z-index:1}
.card.has-img .medal svg{width:34px;height:34px}
.cprev{display:flex;gap:16px;align-items:center}
.cprev h3{margin:0;font:700 1.25rem var(--f-ui);color:var(--title)}.cprev i{color:var(--gold);font-size:.9rem}

.sw{width:36px;height:36px;border:2px solid #3e2c21;box-shadow:inset 0 0 0 2px #0b0807;cursor:pointer;border-radius:2px}

.divs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.dv{display:flex;align-items:center;gap:8px;padding:6px 8px;background:linear-gradient(#1a130f,#0f0b09);border:1px solid #3e2c21;cursor:pointer;font:700 .78rem var(--f-ui);color:var(--text);border-radius:2px;min-width:0}

.dv.on,.cg.on{border-color:var(--gold);box-shadow:0 0 10px rgb(234 169 60 / .35)}
.chg{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
.cg{aspect-ratio:1;max-width:100%;display:grid;place-items:center;border:1px solid #3e2c21;cursor:pointer;border-radius:2px}

function ciLayer(l,cut){
  const tf=l.t?` transform="${l.t}"`:'';
  if(l.grp)return`<g${tf}>${cut?l.grp.map(x=>ciLayer(x,1)).join(''):ciSVG(l.grp)}</g>`;
  if(l.g){
    const G=GI[l.g]||CI[l.g];if(!G)return'';
    const s=l.s||24,x=l.x||0,y=l.y||0,cx=x+s/2,cy=y+s/2;
    let inner,vb;
    if(CI[l.g]&&!GI[l.g]){vb='0 0 24 24';inner=cut?CI[l.g].map(z=>ciLayer(z,1)).join(''):ciSVG(CI[l.g])}
    else{vb=G[0];const w=parseFloat(vb.split(/\s+/)[2]);const sw=CUTW*2*w/s;inner=cut?`<g fill="#000" stroke="#000" stroke-width="${sw}" stroke-linejoin="round">${G[1]}</g>`:G[1]}
    return`<g transform="rotate(${l.r||0} ${cx} ${cy})"${tf}><svg x="${x}" y="${y}" width="${s}" height="${s}" viewBox="${vb}" overflow="visible">${inner}</svg></g>`;
  }
  if(l.sub&&!cut)return'';
  const st=l.st;
  if(cut)return`<path d="${l.p}"${tf} fill="${st?'none':'#000'}" stroke="#000" stroke-width="${(st||1.1)+(l.sub?0:CUTW*2)}" stroke-linecap="round" stroke-linejoin="round"/>`;
  const col=l.c||'currentColor';
  return`<path d="${l.p}"${tf} fill="${st?'none':col}" stroke="${col}" stroke-width="${st||1.1}" stroke-linecap="round" stroke-linejoin="round"/>`;
}
function ciSVG(L){
  let out='';
  for(const l of L){
    if(l.cut||l.sub){
      const id='m'+Math.random().toString(36).slice(2,9);
      out=`<mask id="${id}" maskUnits="userSpaceOnUse" x="-6" y="-6" width="36" height="36"><rect x="-6" y="-6" width="36" height="36" fill="#fff"/>${ciLayer({...l,cut:0},1)}</mask><g mask="url(#${id})">${out}</g>`;
    }
    if(!l.sub)out+=ciLayer(l,0);
  }
  return out;
}

function domCalc(){
  const D=S.house.dom,pop=domPop(),T=TAX[D.tax];
  let taxm=1,cost=0,ds=T.ds,guard=10+S.house.title*5;
  for(const k of D.pol){const P=POLICIES[k];taxm+=P.taxm||0;cost+=(P.cost||0)+Math.round((P.costp||0)*pop);ds+=P.ds||0;guard+=P.guard||0}
  for(const k in D.built){const B=BUILD[k];taxm+=B.taxm||0;ds+=B.ds||0;guard+=B.guard||0}
  const tax=Math.round(pop*T.r*taxm);
  let target=50+ds*2+Math.round((S.st.honor-50)/8);
  if(S.world&&S.world.cat)target-=15;
  if(S.flags.dark)target-=10;
  if(S.flags.saint||S.flags.legend)target+=8;
  return{pop,tax,cost,net:tax-cost,target:Math.max(0,Math.min(100,target)),guard:Math.min(100,guard)};
}

  for(const k of D.pol){const P=POLICIES[k];if(P.fx)mod(P.fx)}

  }

function promote(){
  const j=S.job,J=JOBS[j.id];

  if(J.gate){const g=J.gate(S,j.rank);if(g!==true){if(g)log(g,'bad');return}}
  if(!((J.sure&&J.sure[j.rank])||ch(.3+(j.perf||40)/200)))return;
  j.rank++;j.ry=0;mod({happy:6});log(`Bạn được thăng lên ${jt()}.`,'good');
  if(j.rank===J.t.length-1&&J.top)J.top(S);

}
function famYear(){

      p.alive=false;mod({happy:-Math.round(p.bond/5)});

    }
  }
}

function flavorYear(){
  if(!S.seenF)S.seenF=[];
  if(S.age>3&&!ch(.75))return;
  const pool=FLAV.filter(f=>!S.seenF.includes(f[0])&&f[1](S));
  if(!pool.length)return;
  const f=pick(pool);S.seenF.push(f[0]);
  log(typeof f[2]==='function'?f[2](S):f[2],'');if(f[3])mod(f[3]);
}

function rollEvents(){
  if(S.age<1)return;
  if(!S.evLast)S.evLast={};
  const el=EV.filter(e=>!e.queued&&acOK(e)&&(!e.c||e.c(S))&&!(S.evLast[e.id]!=null&&S.year-S.evLast[e.id]<(e.cd||(e.auto?12:6))));
  const chosen=el.filter(e=>e.force&&e.force(S));
  let pool=el.filter(e=>!chosen.includes(e));
  const r=Math.random();let n=r<.3?0:r<.85?1:2;
  while(n-->0&&pool.length){
    const tot=pool.reduce((a,e)=>a+e.w(S),0);let x=Math.random()*tot,i=0;
    for(;i<pool.length;i++){x-=pool[i].w(S);if(x<=0)break}
    const e=pool[Math.min(i,pool.length-1)];chosen.push(e);pool=pool.filter(z=>z!==e&&!(e.nui&&z.nui));
  }
  for(const e of chosen){
    if(!S.alive)break;
    S.evLast[e.id]=S.year;
    if(e.auto){const[t,tone]=arr(e.f(S));log(t,tone);healthCheck()}else S.pend.push(e.id);
  }
}

function plagueHit(p,intro){
  const lost=[];
  for(const m of S.fam)if(m.alive&&ch(.28)){m.alive=false;lost.push(`${m.rel.toLowerCase()} ${m.first}`)}
  let t=intro+' ';
  if(lost.length){t+=`Dịch bệnh cướp đi ${lost.join(', ')}. `;mod({happy:-10*lost.length})}
  if(ch(p)){mod({health:-R(35,60)});if(S.st.health<=10||ch(.45)){die('dịch hạch');return[t+'Những hạch đen nổi lên dưới cánh tay. Bạn không qua khỏi.','bad']}return[t+'Bạn sốt mê man ba tuần nhưng rồi qua khỏi.','bad']}
  return[t+'Bạn sống sót mà không hề nhiễm bệnh.',lost.length?'bad':'good'];
}
function cand(){
  const sex=S.sex==='m'?'f':'m',rk=CLASSES[S.cls].rk;
  const crk=Math.max(0,Math.min(3,rk+pick([-1,0,0,0,1])));
  const cls=Object.keys(CLASSES).find(k=>CLASSES[k].rk===crk);
  const race=ch(.75)?S.race:pick(Object.keys(RACES));
  const f=pick(nameList(sex,race)),sur=surFor(race,cls);
  return{sex,cls,race,first:f,sur,name:f+' '+sur,age:Math.max(14,S.age+R(-5,S.sex==='m'?2:8)),looks:R(20,90),dowry:sex==='f'?Math.round(CLASSES[cls].money/3)+R(2,15):0};
}
function marry(c){
  const p={id:uid(),rel:c.sex==='m'?'Chồng':'Vợ',sex:c.sex,age:c.age,race:c.race||S.race,first:c.first,sur:c.sur,name:c.name,alive:true,bond:R(55,85),d:0};
  S.fam.push(p);S.spHist.push(c.name);mod({happy:R(8,14)});
  let t=`Bạn thành hôn với ${c.name} trước cửa nhà thờ.`;
  if(c.dowry){S.money+=c.dowry;t+=` Nhà ${c.sex==='f'?'gái':'trai'} mang sang ${c.dowry} xu của hồi môn.`}
  return t;
}

      {t:'Gọi hàng xóm xách nước',f:s=>{const k=ANIMALS.find(a=>s.own[a]>0);s.own[k]--;return[`Lửa tắt nhưng bạn mất một con ${ASSETS[k].n.toLowerCase()}.`,'bad']}}]},
 {id:'feast',w:W(7),c:s=>s.cls==='noble'&&s.age>=12,title:'Yến tiệc ở lâu đài',text:'Bàn dài bày thiên nga quay, bánh nhân thịt và rượu vang xứ Elandor.',
  ch:[{t:'Ăn uống thả cửa',f:()=>{mod({happy:8,health:-3});return'Bạn ăn đến khi phải nới thắt lưng.'}},
      {t:'Kết giao với khách quý',f:s=>{mod({honor:6});s.house.prestige+=10;const r=addFriend({cls:'noble',race:'human',age:Math.max(16,s.age+R(-5,15))});return[`${r?r.name+', một':'Một'} vị khách quý nhớ tên bạn và hứa sẽ nói tốt với nhà vua.${r?' Hai người thành bạn.':''}`,'good']}},
      {t:'Ngâm thơ tình cho cả sảnh nghe',f:s=>{if(ch(.4+s.st.looks/200)){mod({looks:3,happy:8,honor:3});return['Các phu nhân vỗ tay rào rào.','good']}mod({honor:-4,happy:-4});return['Bạn quên lời ở khổ thứ hai. Có tiếng cười khúc khích.','bad']}}]},
 {id:'awaken',w:W(30),c:s=>s.age>=8&&s.age<=14&&(s.st.magic>=50||s.hid.arcane>=70)&&!s.flags.awake,title:'Phép thuật thức tỉnh',big:true,art:'gem',
  text:'Trong cơn giận, bạn làm mọi ngọn nến trong nhà bùng lửa xanh lè. Hôm sau, một con cú mang đến lá thư niêm phong sáp tím của Học viện Tháp Bạc.',
  ch:[{t:'Nhận thư mời của Học viện',f:s=>{s.flags.awake=1;s.flags.academy=1;mod({magic:10,happy:6});return['Bạn được giữ chỗ làm học đồ ở Tháp Bạc khi tròn 14 tuổi (xem mục Nghề).','magic']}},
      {t:'Giấu kín năng lực',f:s=>{s.flags.awake=1;s.flags.suspect=(s.flags.suspect||0)+1;mod({magic:4});return['Bạn đốt lá thư. Nhưng đôi khi ngọn nến vẫn tự bùng lên khi bạn bước vào phòng.','magic']}},
      {t:'Nhờ cha xứ trừ tà',f:s=>{s.flags.awake=1;mod({magic:-15,piety:10});return'Cha xứ vẩy nước thánh lên người bạn suốt ba ngày. Phép thuật lặng dần.'}}]},
 {id:'dragon',big:true,art:'flame',w:W(3),c:s=>s.age>=12,title:'Rồng lửa xuống thung lũng',
  text:'Một con rồng đỏ, vảy như than hồng, đáp xuống tháp chuông nhà thờ. Nó đã thiêu rụi kho thóc và đòi cả vùng cống nạp vàng.',
  ch:[{t:'Trốn xuống hầm rượu',f:s=>{const k=ANIMALS.find(a=>s.own[a]>0);if(k&&ch(.5)){s.own[k]--;return[`Con rồng mang đi một con ${ASSETS[k].n.toLowerCase()} của bạn.`,'bad']}return'Bạn nín thở dưới hầm cho đến khi tiếng cánh đập xa dần.'}},
      {t:'Góp vàng cống nạp (20 xu)',cost:20,f:s=>{s.money-=20;return'Con rồng ngửi đống vàng, ợ ra một làn khói rồi bay đi.'}},
      {t:'Cầm giáo ra nghênh chiến',req:s=>s.age>=16,f:s=>{const hunt=s.job&&s.job.id==='hunter';const p=.12+(hunt?.25:0)+s.st.health/400+s.hid.sword/300+cbB()/250+(s.own.dragon?.15:0)+(s.race==='orc'||s.race==='dwarf'?.05:0);
        if(ch(p)){const g=R(100,300);s.money+=g;s.flags.dragonslayer=1;mod({honor:30,happy:10});s.house.prestige+=150;if(hunt){s.job.rank=2;s.job.ry=0}gainItem('dragonspear');gainItem('arm_dragon');announce('Kẻ Diệt Rồng',`${s.first} ${s.surname} đã hạ con rồng đỏ. Các thi sĩ khắp ${s.realm} sẽ hát về chiến công này qua nhiều thế hệ.`,'flame','dragon');
          if(s.house.title<2&&ch(.5))grantTitle(2);return[`Bạn đâm mũi giáo vào khe vảy dưới cánh. Con rồng rơi xuống sông. Từ hang của nó bạn mang về ${g} xu.`,'good']}
        if(ch(.35)){die('lửa rồng');return['Một luồng lửa trắng nuốt chửng bạn.','bad']}mod({health:-R(20,35)});return['Đuôi rồng quật bạn văng vào tường đá. Bạn may mắn sống sót.','bad']}}]},
 {id:'fae',w:W(4),c:s=>s.age>=6,title:'Vòng nấm tiên',
  text:'Giữa rừng, bạn bước vào một vòng nấm trắng. Tiếng sáo vọng lên từ lòng đất, và một nữ hoàng tiên đội vương miện gai mỉm cười mời bạn dự tiệc.',
  ch:[{t:'Nhảy múa cùng dân tiên',f:s=>{const n=R(1,7);s.age+=n;s.year=s.by+s.age;for(const p of s.fam)if(p.alive)p.age+=n;mod({magic:15,looks:5});entry();return[`Bạn chỉ nhảy một đêm. Nhưng khi trở về, làng bảo bạn đã mất tích ${n} năm.`,'magic']}},
      {t:'Ăn trái cây tiên',f:s=>{if(ch(.5)){mod({looks:8,magic:6});gainItem('flower');return['Vị ngọt như mật ong và ánh trăng. Nữ hoàng tiên cài lên tóc bạn một bông hoa không bao giờ héo.','magic']}mod({happy:-12});return['Từ đó mọi món ăn của loài người đều nhạt như tro.','bad']}},
      {t:'Lùi ra khỏi vòng nấm',f:()=>{mod({piety:3});return'Bạn làm dấu thánh và lùi lại. Tiếng sáo tắt ngấm.'}}]},
 {id:'stone',big:true,art:'L-stone',w:W(1),c:s=>s.age>=15&&s.age<=45&&!s.flags.stone&&s.house.title<6,title:'Thanh kiếm trong đá',
  text:'Giữa sân nhà thờ lớn có một tảng đá cắm thanh kiếm, khắc dòng chữ: "Ai rút được kiếm này là vua chính danh." Hàng trăm người xếp hàng thử vận.',
  ch:[{t:'Thử rút kiếm',f:s=>{s.flags.stone=1;if(s.st.honor>=75&&s.st.piety>=55&&ch(.5)){s.money+=500;mod({honor:30,happy:20});gainItem('holy_sword');grantTitle(6);return['Lưỡi kiếm trượt ra khỏi đá nhẹ như rút khỏi nước. Đám đông quỳ rạp.','good']}mod({honor:-2});return'Thanh kiếm không nhúc nhích. Đám đông cười ồ lên.'}},
      {t:'Đứng xem người khác thử',f:s=>{s.flags.stone=1;mod({happy:3});return'Một gã thợ rèn to khỏe gồng đỏ cả mặt mà không rút nổi.'}}]},
 {id:'goblin',w:W(5),c:s=>s.age>=13,title:'Yêu tinh cướp làng',
  text:'Đêm trăng non, một toán yêu tinh từ đồi đá tràn xuống trộm gà và bắt cóc con nhà thợ xay.',
  ch:[{t:'Cầm đuốc đuổi theo vào hang',f:s=>{if(ch(.5+(s.own.dragon?.3:0))){const g=R(5,30);s.money+=g;mod({honor:10});if(ch(.25))gainItem(pick(['gem','amulet','map']));return[`Bạn cứu được đứa bé và mang về ${g} xu từ kho đồ ăn cắp của lũ yêu tinh.`,'good']}mod({health:-15});return['Lũ yêu tinh ném đá từ trên vách hang. Bạn về nhà với cái đầu sưng vù.','bad']}},
      {t:'Đặt bẫy sắt quanh nhà',f:()=>{mod({honor:2});return'Sáng ra bẫy kẹp một con yêu tinh đang chửi rủa bằng thứ tiếng không ai hiểu.'}},
      {t:'Để bát sữa ngoài cửa cầu an',f:s=>{if(s.own.hen>0&&ch(.5)){s.own.hen--;return['Chúng uống sữa, rồi vẫn trộm một con gà mái.','bad']}return'Chúng uống sạch sữa và để yên cho nhà bạn.'}}]},
 {id:'werewolf',w:W(2),c:s=>s.age>=16&&!s.flags.were,title:'Dưới trăng tròn',
  text:'Đi đêm về, bạn nghe tiếng tru rất gần. Một con sói khổng lồ đứng bằng hai chân chắn ngang đường mòn.',
  ch:[{t:'Chạy thục mạng',f:s=>{if(ch(.5)){s.flags.were=1;mod({health:-10});return['Nó cắn vào bắp chân bạn trước khi bạn kịp leo lên cây. Vết cắn lành nhanh một cách kỳ lạ.','magic']}return'Bạn chạy về đến làng, tim đập như trống trận.'}},
      {t:'Giơ thánh giá lên',f:s=>{if(ch(.3+s.st.piety/200)){mod({piety:6});return['Con sói rú lên rồi lủi vào bóng tối.','good']}s.flags.were=1;return['Nó gạt thánh giá đi và cắn vào vai bạn. Từ đêm đó, ánh trăng làm bạn bồn chồn.','magic']}}]},
 {id:'egg',w:W(1),c:s=>s.age>=12&&!s.own.dragon,title:'Trứng rồng',
  text:'Trong hang đá sau thác nước, bạn tìm thấy một quả trứng to bằng cái thùng, vỏ đỏ như hồng ngọc, vẫn còn ấm.',
  ch:[{t:'Mang về ấp bên lò sưởi',f:s=>{s.own.dragon=1;mod({happy:10,honor:5});return['Sau ba tháng, vỏ trứng nứt toác. Một chú rồng con bằng con mèo bò ra và ngủ ngay trên đùi bạn.','magic']}},
      {t:'Bán cho pháp sư (200 xu)',f:s=>{s.money+=200;return'Lão pháp sư trả tiền mà không mặc cả một câu.'}},
      {t:'Để lại trong hang',f:()=>'Bạn đặt quả trứng về chỗ cũ và đi thật nhanh.'}]},
 {id:'ghost',w:W(3),c:s=>s.age>=10,title:'Bóng ma trong nhà kho',
  text:'Mấy đêm liền, một bóng người mờ như sương lảng vảng trong nhà kho, khóc thút thít.',
  ch:[{t:'Hỏi nó muốn gì',f:s=>{if(ch(.6)){const g=R(20,80);s.money+=g;mod({magic:3});return[`Hồn ma chỉ chỗ nó chôn hũ tiền khi còn sống: ${g} xu. Rồi nó tan biến, thanh thản.`,'good']}mod({happy:-8});return['Hồn ma gào lên tên một người bạn không biết. Bạn mất ngủ cả tháng.','bad']}},
      {t:'Mời cha xứ trừ tà (5 xu)',cost:5,f:s=>{s.money-=5;mod({piety:5});return'Cha xứ đọc kinh và rảy nước thánh. Nhà kho im lặng từ đó.'}}]},
 /* --- thánh nữ, dị giáo --- */
 {id:'saint',big:true,art:'cross',w:s=>s.flags.blessed?25:6,c:s=>s.sex==='f'&&s.race==='human'&&s.age>=12&&s.age<=25&&!spouse()&&!s.flags.saint&&!s.flags.saintNo&&!s.flags.her&&s.st.piety>=55,title:'Thánh Nữ được chọn',
  text:'Đêm lễ Thánh Quang, chuông nhà thờ lớn tự rung dù không ai kéo. Ngọn nến trên tay bạn cháy thành ngọn lửa trắng. Đức Giám mục quỳ xuống và tuyên bố: Thiên Chúa đã chọn bạn làm Thánh Nữ.',
  ch:[{t:'Đón nhận thánh ân',f:s=>{s.flags.saint=1;if(s.job&&!['church','mission'].includes(s.job.id))s.job=null;mod({piety:20,honor:25,happy:10});s.house.prestige+=120;gainItem('chalice');announce('Thánh Nữ',`${s.first} ${s.surname} được Giáo hội tôn làm Thánh Nữ. Người không kết hôn, nhưng mỗi năm nhận bổng lộc và có thể ban phước chữa lành. Uy danh gia tộc vang khắp ${s.realm}.`,'cross','saint');return['Dân chúng quỳ dọc hai bên đường khi bạn bước ra khỏi nhà thờ.','good']}},
      {t:'Từ chối, xin sống đời thường',f:s=>{s.flags.saintNo=1;mod({piety:-5});return'Đức Giám mục thở dài. Ánh sáng trên tay bạn tắt dần.'}}]},
 {id:'miracle',w:W(6),c:s=>s.flags.saint,auto:true,f:s=>{mod({honor:5});s.house.prestige+=20;return['Một người mù chạm vào gấu áo bạn và nhìn thấy ánh sáng. Dân hành hương kéo đến xin phước.','good']}},
 {id:'cult',big:true,art:'moon',w:s=>3+(s.flags.suspect||0)+(s.st.magic>=50?3:0)+(s.race==='fiend'?3:0),c:s=>s.age>=15&&!s.flags.her&&!s.flags.cultNo,title:'Trăng Đỏ',
  text:'Đêm trăng đỏ như máu, một người trùm áo choàng dúi vào tay bạn mẩu giấy: "Giáo hội nói dối. Hãy đến hang đá sau cối xay lúc nửa đêm." Trong hang, hàng chục người thắp nến đen, hát bằng thứ tiếng cổ xưa.',
  ch:[{t:'Gia nhập Giáo phái Hồng Nguyệt',f:s=>{s.flags.her=1;s.flags.herxp=0;mod({magic:10,piety:-15,happy:5});let t='Bạn uống một ngụm rượu đỏ từ chén sừng. Từ nay bạn là Tín đồ Hồng Nguyệt.';if(s.flags.saint){s.flags.saint=0;mod({honor:-30});t+=' Giáo hội phát hiện và tước danh hiệu Thánh Nữ của bạn.'}if(s.job&&['church','mission'].includes(s.job.id)){s.job=null;t+=' Bạn bỏ áo dòng.'}return[t,'magic']}},
      {t:'Tố giác với cha xứ',f:s=>{s.flags.cultNo=1;mod({honor:8,piety:6});return['Sáng hôm sau lính tuần bao vây hang đá. Cha xứ khen bạn trước cả giáo đoàn.','good']}},
      {t:'Lặng lẽ bỏ về',f:s=>{s.flags.cultNo=1;return'Bạn đi về dưới ánh trăng đỏ, cố quên những gì đã thấy.'}}]},
 {id:'inq',big:true,art:'flame',w:s=>3+s.flags.her*3+(s.flags.suspect||0),c:s=>s.flags.her>0&&s.house.title<6,title:'Tòa Dị Giáo',
  text:'Các thầy dòng áo đen của Tòa Dị Giáo đến làng, mang theo danh sách những kẻ bị tố giác. Tên bạn nằm ở dòng thứ ba.',
  ch:[{t:'Chối bỏ dị giáo, chịu sám hối',f:s=>{s.flags.her=0;s.flags.suspect=0;mod({honor:-15,piety:10,happy:-10});return'Bạn đi chân trần quanh nhà thờ bảy vòng, khoác áo vải thô thêu chữ thập vàng của kẻ sám hối.'}},
      {t:'Trốn vào núi',f:s=>{s.village=pick(VILL.filter(v=>v!==s.village));mod({honor:-10,happy:-8});if(s.job&&!JOBS[s.job.id].mobile)s.job=null;return`Bạn trốn qua đèo trong đêm và lẩn vào làng ${s.village}.`}},
      {t:'Dùng phép chống trả',req:s=>s.flags.her>=2,f:s=>{if(ch(.2+s.st.magic/250+s.hid.arcane/300)){mod({magic:5,honor:-5});s.flags.suspect=0;return['Bóng tối nuốt chửng đuốc của bọn thầy dòng. Chúng bỏ chạy, và không ai dám nhắc tên bạn nữa.','magic']}die('bị Tòa Dị Giáo hỏa thiêu');return['Phép của bạn tắt ngấm trước thánh tích của Tòa án.','bad']}}]},
 /* --- truyền giáo, tộc người --- */
 {id:'convert',big:true,art:'cross',w:W(10),c:s=>s.job&&s.job.id==='mission',title:'Tù trưởng ngoại đạo',
  text:'Bạn đến làng của một bộ lạc thờ thần cây. Tù trưởng ngồi trên ngai gỗ sồi, tay cầm rìu đá, nhìn bạn không chớp mắt.',
  ch:[{t:'Giảng đạo trước cả bộ lạc',f:s=>{if(ch(.3+s.st.smarts/300+s.st.piety/300)){gainItem('relic');s.house.prestige+=60;mod({honor:12,piety:8});if(s.job)s.job.perf=100;return['Tù trưởng chịu phép rửa trong dòng suối. Cả bộ lạc theo sau. Ông tặng bạn thánh tích của vị thánh đầu tiên đến vùng này.','good']}if(ch(.15)){die('tay một bộ lạc ngoại đạo');return['Tù trưởng giơ rìu đá lên.','bad']}mod({health:-10});return['Bạn bị đuổi khỏi làng bằng gậy gộc.','bad']}},
      {t:'Tặng quà làm quen (20 xu)',cost:20,f:s=>{s.money-=20;mod({honor:4});return'Tù trưởng nhận quà và cho phép bạn dựng một nhà nguyện nhỏ.'}},
      {t:'Rời đi',f:()=>'Bạn quyết định chưa đến lúc.'}]},
 {id:'orcchief',big:true,art:'horn',w:W(6),c:s=>s.race==='orc'&&s.age>=18&&s.age<=45&&s.house.title<2,title:'Thách đấu thủ lĩnh',
  text:'Thủ lĩnh bộ lạc Nanh Đá đã già, răng nanh đã gãy. Theo luật Orc, ai hạ được ông ta trong vòng đá sẽ lên làm thủ lĩnh.',
  ch:[{t:'Bước vào vòng đá',f:s=>{if(ch(.3+s.st.health/200)){gainItem('horn');gainItem('thunderaxe');mod({honor:15});grantTitle(2);return['Bạn quật ngã gã thủ lĩnh già. Cả bộ lạc gầm vang tên bạn, và nhà vua buộc phải công nhận bạn là chủ một vùng đất.','good']}if(ch(.25)){die('trong trận thách đấu thủ lĩnh');return['Chiếc rìu của gã thủ lĩnh già vẫn còn sắc.','bad']}mod({health:-25,honor:-5});return['Bạn thua và bị quẳng ra khỏi vòng đá.','bad']}},
      {t:'Chưa phải lúc',f:()=>'Bạn mài rìu và chờ đợi.'}]},
 {id:'beastrite',big:true,art:'totem',w:W(8),c:s=>s.race==='beast'&&s.age>=13&&!s.flags.rite,title:'Lễ trưởng thành dưới trăng',
  text:'Các bô lão tộc thú dẫn bạn vào rừng sâu. Bạn phải săn một mình suốt ba đêm trăng tròn, không vũ khí, không lửa.',
  ch:[{t:'Bước vào rừng',f:s=>{s.flags.rite=1;if(ch(.7)){gainItem('totem');mod({health:5,honor:10,magic:5});return['Đêm thứ ba, bạn tha về con lợn rừng lớn nhất. Các bô lão trao cho bạn vật tổ của tộc.','good']}mod({health:-15});return['Bạn trở về tay trắng, người đầy vết cào.','bad']}},

  text:'Đêm ấy, bóng của bạn không còn đi theo ánh nến. Một giọng nói lạnh như sắt vang lên trong đầu: "Ngươi sinh ra để cai trị, không phải để quỳ. Hãy mở cửa cho ta."',
  ch:[{t:'Mở cửa cho Hắc Ám',f:s=>{s.flags.dark=1;mod({magic:30,health:10,piety:-40,honor:-25});s.hid.arcane=Math.min(100,s.hid.arcane+10);gainItem('darkcrown');gainItem('arm_dark');s.world.cat={id:'player',y:s.year};if(s.job&&['church','mission'].includes(s.job.id))s.job=null;announce('Một Thảm Họa ra đời',`${s.first} ${s.surname} đã thức tỉnh sức mạnh Hắc Ám. Các nhà tiên tri khắp ${s.realm} cùng mơ một giấc mơ: bóng tối mang gương mặt của bạn.`,'moon','demon');return['Mắt bạn hóa đỏ. Ngọn nến trong phòng tắt cùng lúc với mọi ngọn nến trong làng.','magic']}},
      {t:'Cự tuyệt và cầu nguyện đến sáng',f:s=>{s.flags.darkNo=1;mod({piety:10});return['Đến bình minh, giọng nói im bặt. Nhưng đôi khi bạn vẫn nghe nó thì thầm.','good']}}]},
 {id:'darkyear',queued:true,big:true,art:'moon',c:s=>s.flags.dark,title:s=>s.house.title>=6?'Ma Vương ngự triều':'Bóng tối lan rộng',
  text:s=>`Quân đoàn bóng tối của bạn ${s.house.title>=6?'cai trị cả '+s.realm:'đang lớn dần'}. Các vương quốc láng giềng xây thêm tường thành và cầu nguyện mỗi đêm.`,
  ch:[{t:'Chinh phạt',f:s=>{if(ch(.3+s.st.magic/300+s.hid.arcane/400)){if(ch(.4)&&!hasItem('h_demon'))gainItem('h_demon');s.money+=R(100,400);if(s.house.title<6){grantTitle(Math.max(2,s.house.title+1));return['Thành trì mở cổng đầu hàng mà không cần một trận đánh.','magic']}s.house.prestige+=100;return[`Quân đoàn của bạn san phẳng kinh đô ${pick(REALMS.filter(x=>x!==s.realm))}. Cả thế giới run sợ khi nghe tên bạn.`,'magic']}mod({health:-15});return['Các hiệp sĩ dòng Thánh Quang đẩy lùi quân của bạn.','bad']}},
      {t:'Triệu hồi quỷ binh',f:()=>{mod({magic:8,piety:-5,health:-5});return['Bạn vẽ vòng tròn bằng máu. Thứ bò ra từ đó đói khát và trung thành.','magic']}},
      {t:'Ẩn mình tích lũy sức mạnh',f:()=>{mod({magic:5,health:5});return'Bạn ngồi thiền trong tháp đen suốt mùa đông.'}}]},
 {id:'herocomes',queued:true,big:true,art:'sword',c:s=>s.flags.dark,title:'Anh Hùng đã đến',
  text:()=>`Một ${pick(['chàng trai','cô gái'])} cầm thanh kiếm phát sáng phá cổng lâu đài bạn. Các nhà tiên tri gọi người đó là Anh Hùng trong Lời Tiên Tri.`,
  ch:[{t:'Đối đầu',f:s=>{if(ch(.35+s.st.magic/300+s.hid.arcane/400)){mod({magic:5,honor:-5});s.house.prestige+=50;return['Lưỡi kiếm sáng vỡ tan trên tay bạn. Anh hùng ngã xuống, và lời tiên tri phải chờ thêm một thế hệ.','magic']}die('dưới lưỡi kiếm của Anh Hùng trong Lời Tiên Tri');return['Ánh sáng xuyên qua tim bạn.','bad']}},
      {t:'Bỏ trốn qua cổng bóng tối',f:s=>{mod({honor:-10});s.money=Math.floor(Math.max(s.money,0)/2);if(s.house.title>=2)s.house.title--;return['Bạn thoát được, nhưng mất lâu đài và một nửa kho báu.','bad']}},
      {t:'Từ bỏ Hắc Ám',f:s=>{if(ch(.35+s.st.piety/200)){s.flags.dark=0;s.flags.darkNo=1;s.world.cat=null;s.world.last=s.year;mod({magic:-25,honor:15,piety:10});return['Anh hùng hạ kiếm. Bạn quỳ xuống, và bóng tối rời khỏi cơ thể bạn như làn khói.','good']}die('khi Hắc Ám không chịu buông tha');return['Bóng tối không chịu rời đi. Nó nuốt chửng bạn từ bên trong.','bad']}}]},
 /* --- thêm sự kiện ngẫu nhiên --- */
 {id:'oldmaster',w:s=>s.hid.sword>=60?6:2,c:s=>s.age>=8&&s.age<=30&&!s.flags.master,title:'Lão kiếm khách',
  text:'Một ông lão chột mắt dừng chân ở quán trọ, nhìn bạn chẻ củi rồi nói: "Trong cổ tay ngươi có một thanh kiếm."',
  ch:[{t:'Xin làm đệ tử',f:s=>{s.flags.master=1;s.flags.seenS=1;if(s.hid.sword>=60){s.hid.sword=Math.min(100,s.hid.sword+8);mod({health:5,honor:5});return[`Ông dạy bạn suốt một mùa đông. Trước khi đi, ông nói thiên phú kiếm của bạn ${talentWord(s.hid.sword)}.`,'good']}mod({health:3});return`Ông dạy bạn vài thế kiếm rồi lắc đầu: "Thiên phú của ngươi ${talentWord(s.hid.sword)}. Hãy chăm chỉ."`}},
      {t:'Mặc kệ ông lão',f:s=>{s.flags.master=1;return'Sáng hôm sau ông đã đi mất.'}}]},
 {id:'magetest',w:s=>s.hid.arcane>=60?6:2,c:s=>s.age>=6&&s.age<=30&&!s.flags.magetest,title:'Quả cầu thử phép',
  text:'Một pháp sư lang thang bày lên bàn quả cầu pha lê. "Đặt tay lên đây, một xu một lần, để biết ngươi có Cảm Nhận Ma Pháp hay không."',
  ch:[{t:'Thử (1 xu)',cost:1,f:s=>{s.money-=1;s.flags.magetest=1;s.flags.seenA=1;const v=s.hid.arcane;if(v>=75){mod({magic:6});return[`Quả cầu sáng rực như mặt trời nhỏ. Pháp sư lùi lại: "Cảm nhận ma pháp ${talentWord(v)}!"`,'magic']}return`Quả cầu le lói. Pháp sư nhún vai: cảm nhận ma pháp của bạn ${talentWord(v)}.`}},
      {t:'Không tin trò bịp',f:s=>{s.flags.magetest=1;return'Bạn bỏ đi. Sau lưng, quả cầu chợt lóe sáng một chút.'}}]},
 {id:'bandits',w:W(5),c:s=>s.age>=14,title:'Cướp đường',text:'Trên đường đi chợ, ba tên cướp bịt mặt nhảy ra từ bụi rậm, kiếm gỉ chĩa vào bạn.',
  ch:[{t:'Rút dao chống trả',f:s=>{if(ch(.3+s.hid.sword/150+cbB()/200)){mod({honor:8});s.money+=R(5,20);return['Bạn hạ một tên, hai tên kia bỏ chạy để lại túi tiền.','good']}mod({health:-R(10,20)});fine(15);return['Bạn bị đánh ngất và mất túi tiền.','bad']}},
      {t:'Nộp tiền (10 xu)',cost:10,f:s=>{s.money-=10;return'Bọn cướp đếm tiền rồi biến vào rừng.'}},
      {t:'Bỏ chạy',f:()=>{if(ch(.6))return'Bạn chạy một mạch về làng.';fine(10);mod({health:-5});return['Chúng đuổi kịp và lột sạch túi bạn.','bad']}}]},
 {id:'mermaid',w:W(3),c:s=>s.age>=14,title:'Tiếng hát bên hồ',text:'Sương mù phủ mặt hồ. Một tiếng hát ngọt như mật vọng lên, và một bàn tay trắng vẫy bạn xuống nước.',
  ch:[{t:'Bước xuống nước',f:()=>{if(ch(.5)){mod({looks:6,magic:6,happy:6});return['Nàng tiên cá hôn lên trán bạn rồi lặn mất. Từ đó mắt bạn sáng như mặt hồ.','magic']}if(ch(.25)){die('chết đuối trong hồ sương mù');return['Nước lạnh kéo bạn xuống.','bad']}mod({health:-10});return['Bạn bị kéo xuống nước và ngoi lên được trong gang tấc.','bad']}},
      {t:'Bịt tai bỏ đi',f:()=>'Tiếng hát đuổi theo bạn đến tận cổng làng.'}]},
 {id:'mimic',w:W(3),c:s=>s.age>=12,title:'Chiếc rương bên đường',text:'Giữa đường mòn có một chiếc rương gỗ bọc đồng, ổ khóa đã mở sẵn. Không có ai xung quanh.',
  ch:[{t:'Mở rương',f:s=>{if(ch(.45)){const g=R(20,90);s.money+=g;if(ch(.3))gainItem(pick(['gem','amulet','map']));return[`Trong rương có ${g} xu và vài món đồ quý.`,'good']}mod({health:-R(10,20)});return['Chiếc rương mọc răng và đớp trúng tay bạn. Đó là quái vật giả rương!','bad']}},
      {t:'Ném đá thử trước',f:()=>{if(ch(.5)){mod({smarts:3});return['Hòn đá vừa chạm vào, chiếc rương há miệng đầy răng. Bạn mừng vì đã cẩn thận.','good']}return'Chiếc rương im lìm. Khi bạn quay lại thì nó đã biến mất.'}},
      {t:'Đi tiếp',f:()=>'Có những món hời không đáng để thử.'}]},
 {id:'beggar',w:W(4),c:s=>s.age>=10,title:'Lão ăn xin',text:'Một lão ăn xin rách rưới chìa bát gỗ ra trước mặt bạn. Đôi mắt lão sáng lạ thường.',
  ch:[{t:'Cho 3 xu và một ổ bánh',cost:3,f:s=>{s.money-=3;mod({piety:4});if(ch(.2)){const g=R(40,120);s.money+=g;mod({honor:6});return[`Tuần sau, lính hoàng gia mang đến ${g} xu: lão ăn xin chính là nhà vua cải trang.`,'good']}return'Lão cúi đầu cảm ơn và chúc phúc cho bạn.'}},
      {t:'Lờ đi',f:()=>{if(ch(.15)){mod({happy:-6});return['Lão nhìn theo bạn, lẩm bẩm gì đó. Cả tháng sau bạn xui xẻo liên miên.','bad']}return'Bạn đi tiếp.'}}]},
 {id:'duel',w:s=>s.cls==='noble'||s.flags.knight?6:2,c:s=>s.age>=16&&s.age<=50,title:'Lời thách đấu',text:'Một kẻ kiêu ngạo ném găng tay xuống trước mặt bạn giữa quảng trường: "Ta thách ngươi đấu kiếm đến giọt máu đầu tiên!"',
  ch:[{t:'Nhận lời thách đấu',f:s=>{if(ch(.25+s.hid.sword/130+cbB()/250)){mod({honor:12,happy:5});s.house.prestige+=10;if(ch(.4))addEnemy('Kẻ thua bạn trong cuộc đấu kiếm',{sex:'m',cls:'noble',hate:R(45,60)});return['Ba đường kiếm, và kẻ kia đã quỳ xuống. Đám đông reo hò tên bạn.','good']}mod({health:-15,honor:-5});return['Mũi kiếm của hắn rạch một đường dài trên cánh tay bạn.','bad']}},
      {t:'Từ chối',f:()=>{mod({honor:-8});return'Hắn cười khẩy và gọi bạn là kẻ hèn.'}}]},
 {id:'cat',w:W(1),c:s=>s.age>=6&&!s.flags.cat,title:'Con mèo biết nói',text:'Con mèo mướp nhà bạn bỗng ngồi thẳng dậy và nói: "Ta cần ba con cá trích. Đổi lại, ta kể cho ngươi một bí mật."',
  ch:[{t:'Mang cá cho mèo (2 xu)',cost:2,f:s=>{s.flags.cat=1;s.money-=2;const r=R(1,3);if(r===1){const g=R(15,50);s.money+=g;return[`Mèo chỉ chỗ lão hàng xóm giấu tiền dưới chuồng gà. Bạn "nhặt được" ${g} xu.`,'good']}if(r===2){s.flags.seenA=1;return[`Mèo nhìn bạn rất lâu rồi nói: "Cảm nhận ma pháp của ngươi ${talentWord(s.hid.arcane)}."`,'magic']}mod({smarts:4});return'Mèo kể chuyện về các vị vua xưa. Rồi nó không bao giờ nói thêm lời nào nữa.'}},
      {t:'Đuổi mèo đi',f:s=>{s.flags.cat=1;mod({happy:-2});return'Con mèo liếc bạn khinh bỉ rồi bỏ đi mất ba ngày.'}}]},
 {id:'beggarsword',w:s=>s.hid.sword>=60?4:1.5,c:s=>s.age>=8&&s.age<=35&&!s.flags.beggarS,title:'Ông lão ăn xin',
  text:'Một ông lão ăn xin chống gậy trúc ngồi bên giếng làng. Khi bạn đi ngang, cây gậy của ông chặn ngang trước mũi chân bạn, nhanh đến mức bạn không kịp thấy nó chuyển động.',
  ch:[{t:'Chia cho ông nửa ổ bánh',f:s=>{s.flags.beggarS=1;s.flags.seenS=1;const v=s.hid.sword;mod({piety:2});
        if(v>=70){s.hid.sword=Math.min(100,v+6);mod({health:3,honor:3});let t=`Ông nhai bánh, rồi gõ nhẹ gậy vào cổ tay bạn: "Thiên phú kiếm thuật của ngươi ${talentWord(v)}." Đêm đó ông dạy bạn một thế kiếm không có trong sách nào, rồi biến mất như chưa từng tồn tại.`;if(v>=85&&S.bag.length<BAGMAX&&!hasItem('canesword')){gainItem('canesword');t+=' Sáng ra, cây gậy trúc của ông nằm lại bên giếng. Bên trong là một lưỡi kiếm mảnh như sợi chỉ bạc.'}return[t,'good']}
        return`Ông nhai bánh, nhìn tay bạn rồi lắc đầu cười: "Thiên phú kiếm thuật của ngươi ${talentWord(v)}. Cầm cày có khi hợp hơn."`}},
      {t:'Thử giật lấy cây gậy',f:s=>{s.flags.beggarS=1;s.flags.seenS=1;const v=s.hid.sword;if(ch(v/130)){s.hid.sword=Math.min(100,v+3);mod({honor:4});return[`Đầu ngón tay bạn chạm được vào gậy. Ông lão cười vang: "Nhanh! Thiên phú kiếm thuật của ngươi ${talentWord(v)}."`,'good']}mod({health:-3});return[`Ông gõ ba cái lên đầu bạn trước khi bạn kịp nhúc nhích. "Chậm. Thiên phú của ngươi ${talentWord(v)}."`,'bad']}},
      {t:'Đi vòng qua',f:s=>{s.flags.beggarS=1;return'Bạn bước vòng qua cây gậy. Sau lưng, ông lão thở dài.'}}]},
 {id:'frostknight',big:true,art:'shield',w:W(1),c:s=>s.age>=16&&s.age<=55&&!s.flags.frost,title:'Hiệp sĩ trong băng',
  text:'Lạc đường giữa bão tuyết trên núi Tuyết, bạn trú vào một hang băng. Giữa hang, một hiệp sĩ đứng bất động trong khối băng trong suốt, giáp của hắn tỏa ánh xanh lạnh lẽo.',
  ch:[{t:'Đục băng lấy bộ giáp',f:s=>{s.flags.frost=1;if(ch(.55+s.st.health/300)){gainItem('arm_frost');mod({honor:4});return['Băng vỡ ra từng mảng. Bộ giáp nhẹ bẫng trong tay bạn, lạnh như gió đông.','magic']}mod({health:-R(15,25)});return['Đúng lúc ấy, khối băng nứt toác và đôi mắt hiệp sĩ mở ra. Bạn bỏ chạy, ngón tay tê cóng suốt một tháng.','bad']}},
      {t:'Cầu nguyện cho linh hồn hắn',f:s=>{s.flags.frost=1;mod({piety:8,magic:3});return['Bạn quỳ cầu nguyện đến khi bão tan. Khi ra khỏi hang, bạn nghe ai đó thì thầm "cảm ơn".','good']}},
      {t:'Rời đi ngay',f:s=>{s.flags.frost=1;return'Bạn đội bão xuống núi, không dám ngoảnh lại.'}}]},
 {id:'phoenix',big:true,art:'flame',w:W(1),c:s=>s.age>=12&&!s.flags.phoenix,title:'Phượng hoàng tái sinh',
  text:'Lúc hoàng hôn, một con chim lửa khổng lồ đáp xuống tháp chuông bỏ hoang rồi tự bốc cháy. Sáng hôm sau, giữa đống tro vẫn còn ấm là những chiếc lông vũ đỏ rực.',
  ch:[{t:'Nhặt lông và tro mang đến thợ rèn (60 xu)',cost:60,f:s=>{s.flags.phoenix=1;s.money-=60;gainItem('arm_phoenix');return['Lão thợ rèn làm việc bảy ngày bảy đêm. Bộ giáp ra lò vẫn còn tỏa hơi ấm như mặt trời.','magic']}},
      {t:'Ngồi chờ phượng hoàng tái sinh',f:s=>{s.flags.phoenix=1;mod({magic:8,health:10,happy:6});return['Đến trưa, một chú chim non lông vàng chui lên từ đống tro, nhìn bạn rồi bay vút lên trời.','magic']}},
      {t:'Rải tro xuống ruộng',f:s=>{s.flags.phoenix=1;const g=R(15,40);s.money+=g;return[`Mùa năm ấy lúa trĩu bông. Bạn bán được thêm ${g} xu.`,'good']}}]},
 {id:'domriot',queued:true,big:true,art:'banner',c:s=>myDom()&&s.house.dom,title:'Bạo loạn',
  text:s=>`Đuốc sáng rực khắp ${domName()}. Hàng nghìn người cầm liềm, cầm gậy kéo đến trước cổng ${s.house.title>=6?'cung điện':'lâu đài'}, đòi ${pick(['giảm thuế','bánh mì','công lý','cái đầu của viên quản gia'])}.`,
  ch:[{t:'Điều quân đàn áp',f:s=>{const D=s.house.dom;D.riots++;const c=domCalc();if(ch(.3+c.guard/130)){D.sat=Math.max(0,D.sat-8);mod({honor:-6});return['Lính của bạn dẹp tan đám đông. Máu đổ trên quảng trường, và lãnh địa im lặng một cách đáng sợ.','bad']}if(D.sat<15||ch(.5))return overthrow();D.sat=Math.max(0,D.sat-5);fine(Math.round(c.pop/40));return['Quân lính bỏ chạy. Đám đông đốt kho thóc rồi tự giải tán.','bad']}},
      {t:'Nhượng bộ: hạ thuế và mở kho lúa',f:s=>{const D=s.house.dom;D.riots++;const cost=Math.round(domCalc().pop/50);fine(cost);D.tax='low';D.sat=Math.min(100,D.sat+20);mod({honor:-2});return[`Bạn hạ thuế xuống mức thấp và phát ${cost} xu lương thực. Đám đông dần giải tán.`,'good']}},
      {t:'Một mình ra nói chuyện với dân',f:s=>{const D=s.house.dom;D.riots++;if(ch(.25+s.st.honor/200+s.st.smarts/300)){D.sat=Math.min(100,D.sat+12);mod({honor:5});return['Bạn bước ra không mang vũ khí, lắng nghe từng người. Đến nửa đêm, họ hạ đuốc xuống.','good']}mod({health:-15});D.sat=Math.max(0,D.sat-3);return['Một hòn đá bay trúng trán bạn. Cận vệ phải kéo bạn vào trong.','bad']}}]},
 {id:'pet1',queued:true,c:()=>myDom(),title:'Tiếp dân: tranh chấp ruộng',text:'Hai nông dân giằng co trước mặt bạn vì một mảnh ruộng ven sông. Một người nghèo nhưng có nhân chứng, người kia giàu và dúi vào tay viên thư ký một túi bạc.',
  ch:[{t:'Xử cho người nghèo có nhân chứng',f:s=>{s.house.dom.sat+=4;mod({honor:3});return['Dân trong vùng khen bạn xử công minh.','good']}},{t:'Xử cho người giàu, nhận túi bạc',f:s=>{s.money+=25;s.house.dom.sat-=5;mod({honor:-4});return'Túi bạc nặng trĩu. Người nông dân nghèo khóc ròng ra về.'}},{t:'Thu mảnh ruộng làm của công',f:s=>{s.money+=10;s.house.dom.sat-=3;return'Cả hai cùng ra về tay trắng, lầm bầm chửi rủa.'}}]},
 {id:'pet2',queued:true,c:()=>myDom(),title:'Tiếp dân: kẻ trộm bánh',text:'Lính giải đến một cậu bé gầy trơ xương, bị bắt quả tang trộm một ổ bánh mì ở chợ.',
  ch:[{t:'Tha bổng và cho thêm bánh',f:s=>{s.house.dom.sat+=4;mod({honor:2,piety:2});return['Mẹ cậu bé quỳ xuống hôn gấu áo bạn.','good']}},{t:'Phạt mười roi',f:s=>{s.house.dom.sat-=1;return'Luật là luật. Đám đông lặng lẽ giải tán.'}},{t:'Chặt tay để răn đe',f:s=>{s.house.dom.sat-=7;mod({honor:-3,piety:-2});return['Tiếng thét vang khắp quảng trường. Trộm cắp giảm hẳn, nhưng dân bắt đầu sợ bạn.','bad']}}]},
 {id:'pet3',queued:true,c:()=>myDom(),title:'Tiếp dân: góa phụ',text:'Một góa phụ có năm đứa con nhỏ xin được miễn thuế năm nay. Chồng bà chết trong trận lụt mùa xuân.',
  ch:[{t:'Miễn thuế cho bà',f:s=>{s.money-=3;s.house.dom.sat+=3;mod({piety:2});return['Tin bạn rộng lượng lan khắp các làng.','good']}},{t:'Miễn thuế cho mọi góa phụ trong lãnh địa (30 xu)',cost:30,f:s=>{s.money-=30;s.house.dom.sat+=7;mod({honor:3});return['Các bà mẹ trong lãnh địa thắp nến cầu phúc cho bạn.','good']}},{t:'Từ chối',f:s=>{s.house.dom.sat-=3;return'Bà ôm con ra về trong nước mắt.'}}]},
 {id:'pet4',queued:true,c:()=>myDom(),title:'Tiếp dân: phường hội',text:'Trưởng phường hội thợ dệt xin độc quyền buôn len trong lãnh địa, kèm theo một rương bạc "tạ ơn".',
  ch:[{t:'Chấp thuận, nhận rương bạc',f:s=>{const g=Math.round(domCalc().pop/30);s.money+=g;s.house.dom.sat-=4;return[`Bạn nhận ${g} xu. Giá vải trong lãnh địa tăng gấp đôi.`,'']}},{t:'Từ chối, giữ chợ tự do',f:s=>{s.house.dom.sat+=2;return'Các thợ dệt nhỏ thở phào nhẹ nhõm.'}}]},
 {id:'pet5',queued:true,c:()=>myDom(),title:'Tiếp dân: quan tham',text:'Dân làng tố viên thu thuế của bạn ăn chặn tiền thuế suốt ba năm, lại còn bắt con gái nhà người ta về làm hầu.',
  ch:[{t:'Mở cuộc điều tra',f:s=>{if(ch(.4+s.st.smarts/200)){const g=R(30,90);s.money+=g;s.house.dom.sat+=7;mod({honor:4});return[`Bằng chứng rõ ràng. Hắn bị tống ngục, bạn thu hồi ${g} xu.`,'good']}s.house.dom.sat-=2;return['Hắn xóa sạch dấu vết. Dân cho rằng bạn bao che.','bad']}},{t:'Bao che, nhận phần chia',f:s=>{s.money+=20;s.house.dom.sat-=7;mod({honor:-5});return['Viên thu thuế cúi đầu cảm ơn. Dân làng hiểu rằng kêu ca cũng vô ích.','bad']}}]},
 {id:'domfamine',big:true,art:'skull',w:W(4),c:s=>myDom()&&s.age>=16,title:'Nạn đói trong lãnh địa',text:s=>`Mưa đá phá nát mùa màng ở ${domName()}. Dân bắt đầu ăn cả rễ cây.`,
  ch:[{t:'Mở kho lúa',f:s=>{const D=s.house.dom;if(D.built.granary){D.sat+=6;return['Kho lúa đầy ắp. Không ai trong lãnh địa phải chết đói.','good']}const cost=Math.round(domCalc().pop/40);fine(cost);D.sat+=5;return[`Bạn mua lúa từ vùng khác phát cho dân, tốn ${cost} xu.`,'good']}},
      {t:'Giảm thuế năm nay',f:s=>{s.house.dom.tax='low';s.house.dom.sat+=3;return'Bạn hạ thuế xuống mức thấp để dân có cái ăn.'}},
      {t:'Mặc kệ',f:s=>{s.house.dom.sat-=14;return['Người chết đói nằm dọc đường. Dân oán bạn đến tận xương tủy.','bad']}}]},
 {id:'dombandit',w:W(4),c:s=>myDom()&&s.age>=16,title:'Cướp quấy nhiễu lãnh địa',text:'Một băng cướp chiếm khu rừng phía đông, chặn đường buôn và cướp phá các làng ven rừng.',
  ch:[{t:'Thân chinh dẹp cướp',f:s=>{if(ch(.4+s.hid.sword/200+cbB()/200)){s.house.dom.sat+=6;mod({honor:6});const g=R(20,60);s.money+=g;return[`Bạn treo cờ thắng trận trên hang ổ bọn cướp và thu về ${g} xu.`,'good']}mod({health:-18});s.house.dom.sat-=3;return['Bọn cướp phục kích. Bạn bị thương và phải rút về.','bad']}},
      {t:'Treo thưởng cho thợ săn tiền thưởng (40 xu)',cost:40,f:s=>{s.money-=40;s.house.dom.sat+=3;return'Một tháng sau, đầu tên cầm đầu được bêu trước cổng thành.'}},
      {t:'Làm ngơ',f:s=>{s.house.dom.sat-=6;return['Các làng ven rừng phải tự lo thân.','bad']}}]},
 {id:'domheretic',w:W(3),c:s=>myDom()&&s.age>=16,title:'Nhà tiên tri lang thang',text:'Một nhà tiên tri chân đất giảng đạo ngay giữa chợ, nói rằng mọi người sinh ra đều bình đẳng và lãnh chúa không có quyền thu thuế.',
  ch:[{t:'Bắt giam hắn',f:s=>{s.house.dom.sat-=3;mod({piety:2});return'Hắn bị tống ngục. Những người nghe giảng lặng lẽ giải tán.'}},{t:'Mời hắn vào lâu đài đàm đạo',f:s=>{if(ch(.5)){s.house.dom.sat+=5;mod({smarts:3});return['Hai người tranh luận suốt đêm. Hắn rời đi và kể với dân rằng bạn là người biết lắng nghe.','good']}s.house.dom.sat-=2;return'Hắn mắng bạn ngay giữa sảnh rồi bỏ đi.'}},{t:'Để hắn giảng tiếp',f:s=>{s.house.dom.sat-=4;return['Ngày càng nhiều người không chịu nộp thuế.','bad']}}]},
 {id:'archery',w:W(4),c:s=>s.age>=12,title:'Hội thi bắn cung',text:'Lãnh chúa treo giải một con ngỗng bạc cho người bắn trúng hồng tâm từ trăm bước.',
  ch:[{t:'Tham gia (2 xu)',cost:2,f:s=>{s.money-=2;if(ch(.15+s.hid.sword/300+(s.race==='elf'?.25:0))){s.money+=40;mod({honor:6,happy:6});return['Mũi tên của bạn tách đôi mũi tên của nhà vô địch năm ngoái. Bạn mang về con ngỗng bạc, đổi được 40 xu.','good']}return'Mũi tên của bạn cắm vào cột rào.'}},
      {t:'Đứng xem',f:()=>{mod({happy:3});return'Một cô gái Tiên tộc thắng giải năm nay.'}}]},
 {id:'gingerbread',w:W(2),c:s=>s.age>=5&&s.age<=14,title:'Ngôi nhà bánh gừng',text:'Lạc trong rừng, bạn thấy một ngôi nhà làm bằng bánh gừng và kẹo đường. Một bà lão mỉm cười mời vào.',
  ch:[{t:'Vào ăn bánh',f:s=>{if(ch(.5)){mod({happy:6,health:3});return'Bà lão hóa ra là một phù thủy tốt bụng, cho bạn ăn no rồi chỉ đường về.'}if(ch(.6+s.st.smarts/300)){mod({smarts:5,honor:4});return['Bà lão định nhốt bạn vào lồng, nhưng bạn lừa bà chui vào lò và chạy thoát.','good']}mod({health:-12});return['Bạn bị nhốt ba ngày trước khi trốn được qua khe cửa.','bad']}},
      {t:'Chạy thật nhanh',f:()=>'Bạn chạy đến khi thấy tháp chuông làng.'}]},
 {id:'traveler',w:W(3),c:s=>s.age>=12,title:'Lữ khách áo xám',text:'Một lữ khách đội mũ rộng vành xin ngủ nhờ một đêm. Sáng ra, ông bày lên bàn ba món đồ và bảo bạn được chọn một để trả ơn.',
  ch:[{t:'Chiếc lá vàng',f:s=>{const g=R(20,60);s.money+=g;return[`Chiếc lá hóa thành ${g} đồng xu vàng thật khi chạm vào túi bạn.`,'good']}},
      {t:'Cuốn sổ tay cũ',f:s=>{mod({smarts:6});s.flags.literate=s.flags.literate||(ch(.5)?1:0);return['Cuốn sổ chép đầy những điều kỳ lạ về thảo dược và các vì sao.','magic']}},
      {t:'Cái lọ rỗng',f:s=>{if(ch(.5)){gainItem('elixir');return['Đêm đó, chiếc lọ tự đầy một thứ nước màu hổ phách.','item']}return'Cái lọ vẫn rỗng. Có lẽ bạn đã chọn sai.'}}]},
 {id:'flood',w:W(3),c:s=>s.age>=15,title:'Lũ lớn',text:'Mưa ba ngày ba đêm. Con sông tràn bờ, nước dâng đến ngực người lớn.',
  ch:[{t:'Lội nước cứu hàng xóm',f:s=>{if(ch(.75)){mod({honor:8,health:-5});return['Bạn cõng hai đứa trẻ và một bà cụ lên đồi. Cả làng nhớ ơn bạn.','good']}mod({health:-18});return['Dòng nước cuốn bạn đi một quãng. Bạn bám được vào gốc cây.','bad']}},
      {t:'Lo giữ của nhà mình',f:s=>{const k=ANIMALS.find(a=>s.own[a]>0);if(k&&ch(.5)){s.own[k]--;return[`Nước cuốn mất một con ${ASSETS[k].n.toLowerCase()}.`,'bad']}return'Nhà bạn ướt sũng nhưng không mất gì.'}}]},
 {id:'heroDream',w:W(3),c:s=>isHero()&&!s.world.cat&&s.age>=8,auto:true,f:s=>{mod({magic:2});return['Bạn lại mơ giấc mơ ấy: một thanh kiếm cắm trên đỉnh núi sao, và vô số giọng nói gọi tên bạn.','magic']}},
 {id:'storm',w:W(4),auto:true,f:()=>{if(ch(.3)){mod({health:-6});return['Sét đánh trúng cây sồi cạnh nhà, một cành lớn rơi trúng vai bạn.','bad']}return'Bão lớn quật đổ hàng rào cả làng. Mọi người cùng nhau dựng lại.'}},
 {id:'harvest',w:W(5),c:s=>s.age>=12,auto:true,f:s=>{const g=R(5,20);s.money+=g;mod({happy:4});return[`Được mùa lớn. Bạn bán thóc dư được ${g} xu.`,'good']}},
 {id:'meteor',w:W(2),c:s=>s.age>=8,auto:true,f:()=>{if(ch(.4)&&gainItem('gem'))return['Một ngôi sao băng rơi xuống đồi sau làng. Bạn là người đầu tiên đến nơi và nhặt được một viên pha lê xanh còn nóng.','item'];mod({magic:2});return'Một ngôi sao băng xé ngang trời đêm. Bạn ước một điều.'}},
 {id:'wedding',w:W(4),c:s=>s.age>=6,auto:true,f:()=>{mod({happy:4});return pick(['Làng có đám cưới, bạn nhảy đến khi trời sáng.','Bạn được mời ăn cỗ cưới nhà thợ xay, ăn no đến mức không đứng dậy nổi.'])}},
 {id:'twomoons',w:W(2),auto:true,f:()=>{mod({magic:3});return['Đêm nay có hai mặt trăng trên trời. Không ai giải thích được.','magic']}},
 {id:'pixies',w:W(3),c:s=>s.age>=4,auto:true,f:()=>{mod({happy:3});return'Lũ tiên nhỏ tết bờm ngựa nhà hàng xóm thành hai mươi bím tóc trong một đêm.'}},
 /* --- sự kiện tự động --- */
 {id:'unicorn',w:W(2),auto:true,f:()=>{mod({happy:8,piety:4,magic:3});return['Lúc bình minh, bạn thoáng thấy một con kỳ lân trắng cúi đầu uống nước bên hồ.','magic']}},
 {id:'prophecy',w:W(2),c:s=>s.age>=6,auto:true,f:()=>{mod({magic:2});return[`Một bà tiên tri mù níu tay bạn ở chợ và thì thầm: "${pick(PROPH)}"`,'magic']}},
 {id:'famine',w:W(4),auto:true,f:()=>{mod({health:-R(4,10),happy:-4});return['Mất mùa. Cả làng ăn bánh mì độn cám suốt mùa đông.','bad']}},
 {id:'hoard',w:W(3),c:s=>s.age>=8,auto:true,f:s=>{const g=R(10,45);s.money+=g;return[`Đào mương, bạn đụng phải một hũ đồng xu bạc cũ: ${g} xu.`,'good']}},
 {id:'minstrel',w:W(6),auto:true,f:()=>{mod({happy:5});return'Một gánh hát rong ghé làng, hát bản anh hùng ca về hiệp sĩ Aldric bên đèo Gió Bấc.'}},
 {id:'comet',w:W(3),auto:true,f:()=>{mod({piety:4});return'Một sao chổi đuôi dài hiện trên trời suốt bảy đêm. Cha xứ bảo đó là điềm báo.'}},
 {id:'tax',w:W(5),c:s=>s.age>=16&&s.money>20&&s.house.title<6,auto:true,f:s=>{const t=Math.max(2,Math.round(s.money*.06));s.money-=t;return`Viên thu thuế của nhà vua đến thu thuế đầu người: ${t} xu.`}},
 {id:'fever',w:W(5),c:s=>s.age<=10,auto:true,f:()=>{mod({health:-R(8,20)});return['Bạn lên cơn sốt mười ngày liền. Mẹ đắp lá ngải lên trán bạn từng đêm.','bad']}},
 {id:'fall',w:W(4),c:s=>s.age>=3&&s.age<=10,auto:true,f:()=>{mod({health:-5,happy:-2});return'Bạn trượt chân ngã xuống bờ suối, may có bác thợ xay kéo lên.'}},
 {id:'bright',w:W(3),c:s=>s.age>=5&&s.age<=12,auto:true,f:()=>{mod({smarts:4,happy:3});return['Cha xứ khen bạn là đứa trẻ sáng dạ nhất giáo xứ.','good']}},
 {id:'friend',w:W(5),c:s=>s.age>=4&&s.age<=14&&rels('friend').length<8,auto:true,f:s=>{mod({happy:5});const sex=pick(['m','f']);const r=addFriend({sex,age:Math.max(3,s.age+R(-1,1)),bond:R(55,75)});return[`Bạn kết thân với ${r.first}, ${sex==='m'?pick(['con trai bác thợ xay','thằng bé chăn ngỗng','con trai người thợ rèn']):pick(['con gái người giữ rừng','con bé nhà thợ dệt','con gái bà bán bánh'])}.`,'good']}},
 {id:'newfriend',w:W(5),c:s=>s.age>=12&&rels('friend').length<8,prep:s=>{s.tmp=npc('friend',{age:Math.max(12,s.age+R(-5,6))})},title:'Người lạ tốt bụng',
  text:s=>`Xe bò của bạn sa lầy giữa đường. ${s.tmp.name}, ${RACES[s.tmp.race].n.toLowerCase()} ${s.tmp.age} tuổi, xắn tay áo giúp bạn đẩy xe lên rồi rủ bạn ra quán uống bia.`,
  ch:[{t:'Đi uống bia, kết bạn',f:s=>{if(rels('friend').length<8){s.tmp.bond=R(50,70);s.rel.push(s.tmp)}mod({happy:5});return[`Bạn và ${s.tmp.first} uống đến khi quán đóng cửa. Từ đó hai người thành bạn.`,'good']}},
      {t:'Cảm ơn rồi đi tiếp',f:s=>`${s.tmp.first} vẫy tay chào và đi về phía làng bên.`}]},
 {id:'crush',w:W(6),c:s=>canLove()&&!lover()&&s.age<=35,prep:s=>{const c=cand();s.tmp=npc('lover',{sex:c.sex,race:c.race,cls:c.cls,age:c.age,looks:c.looks,sur:c.sur})},title:'Ánh mắt ở hội làng',
  text:s=>`Ở hội mùa gặt, ${s.tmp.name} (${s.tmp.age} tuổi${s.tmp.race!==s.race?', '+RACES[s.tmp.race].n:''}) cứ nhìn bạn mãi rồi đỏ mặt quay đi khi bạn nhìn lại.`,
  ch:[{t:'Mời nhảy một điệu',f:s=>{if(ch(.4+s.st.looks/250+s.st.happy/500)){s.tmp.bond=R(55,75);s.rel.push(s.tmp);mod({happy:10});return[`Hai người nhảy đến khi trăng lên. ${s.tmp.first} trở thành người yêu của bạn.`,'good']}mod({happy:-4});return['Bạn giẫm lên chân người ta hai lần. Họ cười xòa rồi về với bạn bè.','bad']}},
      {t:'Lờ đi',f:()=>'Bạn giả vờ không thấy. Đêm đó bạn trằn trọc mãi.'}]},
 {id:'loverask',queued:true,c:s=>!!lover()&&canLove(),title:'Lời hẹn ước',
  text:s=>`${lover().first} nắm tay bạn bên bờ suối: "Mình đã bên nhau lâu rồi. Bao giờ chúng ta về chung một nhà?"`,
  ch:[{t:'Cầu hôn ngay',f:s=>{const l=lover();l.alive=false;l.gone=1;return[marry({...l,dowry:l.sex==='f'?Math.round(CLASSES[l.cls].money/3)+R(2,15):0}),'good']}},
      {t:'Xin thêm thời gian',f:s=>{lover().bond-=12;return'Người yêu bạn buồn bã, nhưng gật đầu.'}},
      {t:'Chia tay',f:s=>{const l=lover();l.alive=false;l.gone=1;mod({happy:-6});if(ch(.35)){addEnemy('Người yêu cũ bị bạn bỏ rơi',{id:l.id,hate:R(45,65)});l.alive=true}return['Bạn nói lời chia tay. Người ấy bỏ chạy trong nước mắt.','bad']}}]},

/* ---------- actions ---------- */
function afterSheetAction(){save();render();if(!S.alive){closeSheet();showDeath();return}if(S.ann.length||S.pend.length){closeSheet();showNext();return}drawSheet()}
function doAct(id){const a=ACTS.find(x=>x.id===id);S.done[id]=1;const[t,tone]=arr(a.f(S));log(t,tone);healthCheck();note={t,tone};afterSheetAction()}
function joinJob(id){if(S.job)log(`Bạn thôi làm ${jt().toLowerCase()}.`);S.job={id,rank:0,yr:0,ry:0,perf:40};const t=`Bạn bắt đầu làm ${jt().toLowerCase()}.`;log(t,'good');note={t,tone:'good'};afterSheetAction()}
function quitJob(){const t=`Bạn thôi làm ${jt().toLowerCase()}.`;S.job=null;log(t);note={t,tone:''};afterSheetAction()}
function personAct(s){

  if(a==='plot'){if(ch(.25+S.st.smarts/200)){r.alive=false;r.gone=1;mod({honor:-2});t=`Bạn khéo léo để lộ chuyện mờ ám của ${F} cho viên quản gia. Hắn bị đuổi khỏi vùng.`;tone='good'}else{mod({honor:-10});r.hate=clamp(r.hate+15);t=`Âm mưu bị lộ. Cả làng biết bạn định hãm hại ${F}.`;tone='bad'}}

function crest(h,size=44){
  const id='c'+uid(),c2=h.c2,c3=h.c3||h.c1,div=h.div||'plain',sh='M4 4h40v22c0 14-10 23-20 27C14 49 4 40 4 26z';
  const field={plain:'',pale:`<rect x="24" width="24" height="56" fill="${c3}"/>`,fess:`<rect y="27" width="48" height="30" fill="${c3}"/>`,quarter:`<rect x="24" width="24" height="27" fill="${c3}"/><rect y="27" width="24" height="30" fill="${c3}"/>`,chief:`<rect width="48" height="15" fill="${c3}"/>`,bendy:`<path d="M0 0h16L48 36v20H34L0 14z" fill="${c3}"/>`}[div]||'';
  const geo={chevron:`<path d="M6 36 L24 18 L42 36" fill="none" stroke="${c2}" stroke-width="6"/>`,cross:`<path d="M21 4h6v48h-6zM4 20h40v6H4z" fill="${c2}"/>`,bend:`<path d="M0 6 L8 0 L48 44 L40 52Z" fill="${c2}"/>`};
  let charge=geo[h.charge];
  if(!charge){const y=div==='chief'?17:12,sz=div==='chief'?22:24;if(CI[h.charge]&&!GI[h.charge])charge=`<svg x="${24-sz/2}" y="${y}" width="${sz}" height="${sz}" viewBox="0 0 24 24" style="color:${c2};filter:drop-shadow(0 0 .6px #000)" fill="${c2}">${ciSVG(CI[h.charge])}</svg>`;else{const g=GI[h.charge]||GI.star;charge=`<svg x="${24-sz/2}" y="${y}" width="${sz}" height="${sz}" viewBox="${g[0]}" fill="${c2}" style="filter:drop-shadow(0 0 .6px #000)">${g[1]}</svg>`}}
  return`<svg viewBox="0 0 48 56" width="${size}" height="${Math.round(size*56/48)}" aria-hidden="true" style="flex:none"><defs><clipPath id="${id}"><path d="${sh}"/></clipPath></defs><g clip-path="url(#${id})"><rect width="48" height="56" fill="${h.c1}"/>${field}${charge}</g><path d="${sh}" fill="none" stroke="#c88d59" stroke-width="2"/></svg>`;
}
function portrait(race,sex,alive=true){
  const f='#0b1020',o='#c88d59';
  let back=sex==='f'?`<path d="M20 24c0-10 5-15 12-15s12 5 12 15v16h-5V26H25v14h-5z" fill="${f}" stroke="${o}" stroke-width="1"/>`:'';
  let x='';
  if(race==='elf')x=`<path d="M22.5 22 14 15l6 11zM41.5 22 50 15l-6 11z" fill="${f}" stroke="${o}" stroke-width="1"/>`;
  if(race==='fiend')x=`<path d="M25 14c-4-4-3-9-1-11 0 4 3 7 5 8zM39 14c4-4 3-9 1-11 0 4-3 7-5 8z" fill="#7a1b1b" stroke="${o}" stroke-width="1"/>`;
  if(race==='orc')x=`<path d="M27.5 31l-1.2-5 2.4 3zM36.5 31l1.2-5-2.4 3z" fill="#e8dcc0"/>`;
  if(race==='beast')x=`<path d="M23 16l-3-12 9 8zM41 16l3-12-9 8z" fill="${f}" stroke="${o}" stroke-width="1"/>`;
  if(race==='dwarf')x=`<path d="M23 26c0 12 4 16 9 16s9-4 9-16z" fill="${f}" stroke="${o}" stroke-width="1"/>`;
  const crown=S&&S.house&&S.house.title>=6?`<path d="M24 12l-1-6 4.5 3 4.5-5 4.5 5 4.5-3-1 6z" fill="#eaa93c"/>`:S&&S.flags&&S.flags.saint?`<ellipse cx="32" cy="9" rx="10" ry="2.6" fill="none" stroke="#f5e2a4" stroke-width="1.6"/>`:'';
  return`<svg viewBox="0 0 64 64" aria-hidden="true" style="${alive?'':'filter:grayscale(1) brightness(.6)'}">${back}<path d="M8 66c0-15 11-23 24-23s24 8 24 23z" fill="${f}" stroke="${o}" stroke-width="1.2"/>${x.includes('#e8dcc0')?'':x}<circle cx="32" cy="23" r="10.5" fill="${f}" stroke="${o}" stroke-width="1.2"/>${x.includes('#e8dcc0')?x:''}${S&&S.flags&&S.flags.dark?'<circle cx="28.5" cy="23" r="1.5" fill="#ff2a2a"/><circle cx="35.5" cy="23" r="1.5" fill="#ff2a2a"/>':''}${crown}</svg>`;
}

const HOT=[['job','anvil','Nghề','1'],['act','torch','Hoạt động','2'],['bag','backpack','Túi đồ','3'],['rel','friends','Quan hệ','4'],['house','flag','Gia tộc','5'],['shop','shop','Mua sắm','6']];

  $('#por').innerHTML=portrait(S.race,S.sex,S.alive);
  $('#hp').style.width=S.st.health+'%';$('#hpt').textContent=`Sức khỏe ${S.st.health}/100`;
  $('#mp').style.width=S.st.magic+'%';$('#mpt').textContent=`Ma lực ${S.st.magic}/100`;
  $('#money').textContent=fmt(S.money);$('#goldBox').classList.toggle('debt',S.money<0);
  $('#stats').innerHTML=['happy','smarts','looks','honor','piety'].map(k=>{const v=S.st[k];return`<div class="st"><span>${SL[k]}</span><b>${v}</b><div class="mb"><i class="${v<25?'low':v>=70?'high':''}" style="width:${v}%"></i></div></div>`}).join('');
  $('#chtitle').textContent=S.world.cat?`Thảm Họa · ${S.world.cat.id==='player'?'chính bạn':CATS[S.world.cat.id].n}`:`Biên niên · năm ${S.year}`;
  $('#chron').innerHTML=S.log.map(y=>`<section class="yr"><h3>${y.year}<span>${y.age===0?'Chào đời':y.age+' tuổi'}</span></h3>${y.items.map(i=>`<p class="${i.tone}">${esc(i.t)}</p>`).join('')}</section>`).join('');
  const c=$('#chron');c.scrollTop=c.scrollHeight;
  $('#ageBtn').disabled=!S.alive;
}

function drawSheet(){

  const nt=note?`<p class="note ${note.tone}">${esc(note.t)}</p>`:'';
  if(view==='job'){

function treeHTML(){

    const cur=i===gens.length-1&&S.alive;
    const t=g.title>=2?titleName(g.title,g.sex)+' ':g.saint?'Thánh Nữ ':g.knight?(g.sex==='m'?'Ngài ':'Phu nhân '):'';
    h+=`<div class="tnode ${cur?'cur':''}"><div class="tgen">Đời thứ ${g.gen}${cur?' · đang sống':''}</div><b>${esc(t+g.first)}</b><small>${RACES[g.race].n} · ${g.by} – ${cur?'nay':g.dy}${!cur&&g.cause?' · mất vì '+esc(g.cause):''}${g.slayer?' · Kẻ Diệt Rồng':''}${g.legend?' · Anh Hùng':''}${g.dark?' · Thảm Họa Hắc Ám':''}</small>${g.spouses.length?`<small>Phối ngẫu: ${esc(g.spouses.join(', '))}</small>`:''}<div class="tkids">${g.kids.length?g.kids.map(k=>`<span class="kid ${g.heir===k.id?'heir':''} ${k.alive?'':'dead'}">${esc(k.first)}${g.heir===k.id?' · thừa kế':''}</span>`).join(''):'<span class="kid none">Chưa có con</span>'}</div></div>`;
  });
  return h+'</div>';
}

function modal(html,epic){$('#modal').innerHTML=`<div class="card panel${epic?' epic':''}${epic==='img'?' has-img':''}" role="dialog" aria-modal="true">${html}</div>`;$('#modal').hidden=false;const f=$('#modal button:not(:disabled)');f&&f.focus()}

function showNext(){
  if(!S.alive){showDeath();return}
  if(S.ann.length){const a=S.ann[0];modal(`${imgBanner(a.img)}<div class="cbody">${medal(a.art)}<p class="eyebrow">Sự kiện lớn · năm ${S.year}</p><h2 class="big">${esc(a.title)}</h2><p>${esc(a.sub)}</p><div class="choices"><button class="btn pri" data-annok>Tiếp tục</button></div></div>`,a.img?'img':true);return}
  const id=S.pend[0];if(!id){closeModal();return}
  const e=EVB[id];if(!e||(e.c&&!(e.prep&&S.tmp)&&!e.c(S))){S.pend.shift();save();showNext();return}
  if(e.prep&&!S.tmp){e.prep(S);save()}
  const t=typeof e.text==='function'?e.text(S):e.text;
  evCard(e,`Năm ${S.year} · ${S.age} tuổi`,`<p>${esc(t)}</p>`,e.ch.map((c,i)=>c.hide&&c.req&&!c.req(S)?'':`<button class="btn" data-ec="${i}" ${(c.cost&&S.money<c.cost)||(c.req&&!c.req(S))?'disabled':''}>${typeof c.t==='function'?c.t(S):c.t}</button>`).join(''));
}
function choose(i){
  const e=EVB[S.pend[0]],c=e.ch[i],title=et(e),im0=e.big?eimg(e):null;const[t,tone]=arr(c.f(S));
  S.pend.shift();S.tmp=null;S.tmpEnemy=null;if(S.house&&S.house.dom)S.house.dom.sat=Math.max(0,Math.min(100,Math.round(S.house.dom.sat)));log(`${title}: ${t}`,tone);healthCheck();save();render();
  evCard({...e,title,art:eart(e),img:im0},`Năm ${S.year}`,`<p>${esc(t)}</p>`,'<button class="btn pri" data-next>Tiếp tục</button>');
}
function epitaph(){
  if(S.flags.hcat)return'Mặt trăng đỏ từng mọc trên cả vương quốc vì người.';
  if(S.house.title===7&&rules())return'Hoàng đế của nhiều vương quốc. Đế chế mang tên người.';
  if(S.flags.redpope)return'Giáo chủ của tôn giáo mới, vua của vương quốc trăng đỏ.';
  if(S.flags.dark)return'Thảm Họa của một thời đại. Bóng tối chưa bao giờ thật sự chết.';
  if(S.flags.legend)return'Anh Hùng trong Lời Tiên Tri. Thế gian còn đứng vững là nhờ người.';
  if(S.house.title>=6)return'Người ngồi trên ngai vàng. Vương quốc khóc thương người.';
  if(S.flags.saint)return'Thánh Nữ của muôn dân, nay đã về bên Thiên Chúa.';
  if(S.flags.dragonslayer)return'Kẻ Diệt Rồng. Các thi sĩ sẽ còn hát về người.';
  if(S.flags.her>=3)return'Ngọn lửa trăng đỏ chưa tắt.';
  if(S.money>=800)return'Giàu có khi sống, trắng tay khi về với đất.';

  return{piety:'Người tin kính, nay đã về nhà Cha.',honor:'Danh dự còn mãi sau tấm bia này.',smarts:'Người đọc được những trang sách mà cả làng không đọc nổi.',looks:'Dung nhan từng làm say lòng cả giáo xứ.',happy:'Sống vui, chết thanh thản.',health:'Khỏe như bò cày, cho đến ngày cuối cùng.',magic:'Phép thuật của người còn vương trong gió.'}[top];

function jobAct(i){
  const J=JOBS[S.job.id],A=JACT[S.job.id][i];S.done['ja'+i]=1;let t,tone;
  const p=A[2]+S.job.rank*.04+(S.job.perf||40)/600+(A[0].match(/Săn|đột kích|Đấu|truy|Đẩy lui|tuần/i)?S.hid.sword/600+cbB()/500:0);
  if(ch(p)){
    mod(A[4]);const m=A[5]&&A[5][1]?Math.round(R(A[5][0],A[5][1])*(1+S.job.rank*.5)):0;S.money+=m;
    S.job.perf=Math.min(100,(S.job.perf||40)+R(8,16));t=A[3]+(m?` (+${m} xu)`:'');tone='good';
    if(A[9]&&ch(.15)&&S.bag.length<BAGMAX){gainItem(A[9]);t+=` Bạn còn có được ${ITEMS[A[9]].n.toLowerCase()}.`;tone='item'}
    if(S.job.rank<J.t.length-1&&J.need[S.job.rank]<99&&ch(A[8])){S.job.ry=Math.max(S.job.ry,J.need[S.job.rank]);S.job.rank++;S.job.ry=0;mod({happy:6});t+=` Cấp trên quá hài lòng, bạn được thăng lên ${jt()} sớm hơn dự kiến!`;if(S.job.rank===J.t.length-1&&J.top)J.top(S);if(S.job.id==='knight'&&S.job.rank===2){S.flags.knight=1;mod({honor:15})}if(S.job.id==='knight'&&S.job.rank===3)grantTitle(2);if((S.job.id==='church'||S.job.id==='wizard')&&S.job.rank>=1)S.flags.literate=1}
  }else{
    mod(A[7]);S.job.perf=Math.max(0,(S.job.perf||40)-6);t=A[6];tone='bad';
    if(J.risk&&A[7].health<=-14&&ch(J.risk*1.5)){die(J.riskDie);t+=' Vết thương quá nặng.'}
  }
  log(t,tone);healthCheck();note={t,tone};afterSheetAction();
}
/* ===== family: time together, children marry & have kids ===== */
function allRel(){
  S.done.allrel=1;let n=0;
  for(const p of S.fam)if(p.alive){p.bond=clamp(p.bond+R(3,8));n++}
  for(const r of S.rel)if(r.alive&&r.kind!=='enemy'){r.bond=clamp(r.bond+R(3,8));n++}
  const cost=Math.min(Math.max(S.money,0),Math.round(n*1.5));S.money-=cost;mod({happy:R(5,10)});
  const t=n?`Bạn mở một bữa tối ấm cúng, mời cả ${n} người thân và bạn bè${cost?`, tốn ${cost} xu`:''}. Ai cũng thấy gần nhau hơn.`:'Bạn chẳng còn ai để sum vầy.';
  log(t,n?'good':'');note={t,tone:n?'good':''};afterSheetAction();
}
const adultK=p=>p.age/lifeOf(p.race||S.race)>=17;
function spouseFor(p,royal){const sx=p.sex==='m'?'f':'m',race=ch(.8)?(p.race||S.race):pick(Object.keys(RACES)),cls=royal?'royal':S.house.title>=2?'noble':pick(NPCLS);const f=pick(nameList(sx,race));return{first:f,sur:royal?pick(ROYAL):surFor(race,cls),sex:sx,race,age:Math.max(15,p.age+R(-4,4)),alive:true}}
function wedKid(p,sp,how){p.spouse=sp;p.bond=clamp(p.bond+(how==='arr'?4:6));log(`${p.rel} ${p.first} kết hôn với ${sp.first} ${sp.sur}${how==='arr'?' theo hôn ước bạn sắp đặt':''}.`,'good');mod({happy:5})}
function kidsYear(){
  for(const p of S.fam){
    if(!p.alive)continue;
    if(p.spouse&&p.spouse.alive){p.spouse.age++;if(ch(.012))p.spouse.alive=false}
    if(!/^Con /.test(p.rel))continue;
    if(!p.spouse&&adultK(p)&&!p.vow&&ch(.1)){wedKid(p,spouseFor(p),'self')}
    if(p.spouse&&p.spouse.alive){const ma=(p.sex==='f'?p.age:p.spouse.age)/lifeOf(p.race||S.race);const nk=S.fam.filter(x=>x.pid===p.id).length;
      if(ma<=40&&nk<6&&ch(.2)){const sx=pick(['m','f']);const g=person(sx==='m'?'Cháu trai':'Cháu gái',sx,0,p.sex==='m'?p.sur:p.spouse.sur,pick([p.race||S.race,p.spouse.race||S.race]));g.pid=p.id;g.bond=R(60,90);S.fam.push(g);mod({happy:4});log(`${p.rel} ${p.first} sinh ${sx==='m'?'một bé trai':'một bé gái'}, đặt tên ${g.first}. Bạn lên chức ${S.sex==='m'?'ông':'bà'}!`,'good')}}
  }
}
function arrangeKid(id){
  const p=S.fam.find(x=>x.id===id);p.d=1;const cost=S.house.title>=2?60+S.house.title*20:S.cls==='merchant'?30:10;S.money-=cost;
  const royal=S.house.title>=5&&ch(.5),sp=spouseFor(p,royal);wedKid(p,sp,'arr');
  if(royal){S.house.prestige+=60;mod({honor:5});if(S.kd&&S.kd.realms){const rn=pick(Object.keys(S.kd.realms));S.kd.realms[rn].rel=Math.min(100,S.kd.realms[rn].rel+25)}}
  const t=`Bạn chi ${cost} xu lo sính lễ. ${p.first} và ${sp.first} ${sp.sur} nên duyên vợ chồng${royal?', một cuộc hôn nhân chính trị với hoàng tộc nước ngoài':''}.`;
  note={t,tone:'good'};afterSheetAction();
}
