const RULERS=['Vua Aldemar','Nữ vương Ysolde','Hoàng đế Varek','Vua Thrain Đá Đỏ','Nữ hoàng Seraphine','Giáo hoàng-vua Lucan','Vua Orsik','Nữ vương Elaria'];
function newRealms(){const o={};for(const r of REALMS.filter(x=>x!==S.realm)){o[r]={ruler:pick(RULERS),power:R(12,34),provs:R(3,5),def:R(1,3),rel:R(-30,40),st:'neutral',faith:/Thánh quốc/.test(r)?'holy':'std'}}return o}
const kdOn=()=>S&&S.house.title>=5&&rules();
const isKing=()=>S&&S.house.title>=6&&rules();
function npcOff(){const sx=pick(['m','f','m']),f=pick(nameList(sx,'human'));return{first:f,sur:surFor('human','noble'),sex:sx,skill:R(30,90),amb:R(10,80),loy:R(40,85),wins:0}}
function newKd(){
  const king=S.house.title>=6;
  return{treas:king?500:200,food:60,stab:60,legit:65,dip:50,army:king?{inf:8,arc:4,cav:2,sie:0,gua:1,mag:0}:{inf:4,arc:2,cav:1,sie:0,gua:0,mag:0},xp:.6,bon:{inf:0,cav:0,sie:0},morale:65,drill:null,
    gen:null,lead:'king',provs:king?3:1,war:null,realms:king?newRealms():null,
    council:king?{chan:npcOff(),marsh:npcOff(),treas:npcOff(),spy:npcOff(),priest:npcOff()}:null,
    vassals:king?['Công tước','Bá tước','Bá tước','Nam tước'].map(t=>({...npcOff(),t,power:t==='Công tước'?R(8,14):t==='Bá tước'?R(4,8):R(2,4)})):null,
    edicts:[],tw:0,heir:null,debt:0};
}
function ensureKd(){if(!kdOn())return null;if(!S.kd)S.kd=newKd();const K=S.kd;if(S.house.title>=6&&!K.realms){K.realms=newRealms();K.council={chan:npcOff(),marsh:npcOff(),treas:npcOff(),spy:npcOff(),priest:npcOff()};K.vassals=['Công tước','Bá tước','Bá tước','Nam tước'].map(t=>({...npcOff(),t,power:R(3,12)}));K.provs=Math.max(K.provs,3)}return K}
const troops=K=>Object.values(K.army).reduce((a,b)=>a+b,0);
const upkeep=K=>Math.round(Object.entries(K.army).reduce((a,[k,n])=>a+UNITS[k].up*n,0)*(K.edicts.includes('pay')?1.25:1));
const foodNeed=K=>Object.entries(K.army).reduce((a,[k,n])=>a+UNITS[k].food*n,0);
const manpower=K=>Math.round((POP[S.house.title]||4000)*(1+(K.provs-3)*.2)/220*(K.edicts.includes('levy')?1.5:1)+(S.house.dom&&S.house.dom.built.barracks?6:0));
const vasLoy=K=>K.vassals&&K.vassals.length?Math.round(K.vassals.reduce((a,v)=>a+v.loy,0)/K.vassals.length):60;
function kdPower(extra){
  const K=S.kd;if(!K)return 0;let p=0;
  for(const[k,n]of Object.entries(K.army)){const U=UNITS[k];p+=n*(U.atk+U.def)/2*(1+((K.bon&&K.bon[k])||0)*.25)}
  p*=1+K.xp*.25;p*=.55+K.morale/150;
  const g=K.lead==='gen'&&K.gen?K.gen.skill:K.lead==='king'?40+S.hid.sword*.3+S.st.smarts*.2:40;p*=1+(g-50)/160;
  if(S.house.dom&&S.house.dom.built.forgehall)p*=1.1;if(S.own.dragon)p*=1.15;if(S.flags.legend)p*=1.1;
  if(extra)p+=extra;return Math.round(p*10)/10;
}
function kdLose(f){const K=S.kd;if(!K)return;for(const k in K.army)K.army[k]=Math.max(0,Math.round(K.army[k]*(1-f)*10)/10)}
function addTroops(k,n){const K=S.kd,t=troops(K);K.army[k]=Math.round((K.army[k]+n)*10)/10;K.xp=Math.round(K.xp*t/(t+n)*100)/100}
function realmPow(r){const R0=S.kd.realms[r];return R0.power*(1+R0.def*.12)}
function kdYear(){
  const K=ensureKd();if(!K)return;
  const D=S.house.dom,c=D?domCalc():{net:0},vas=K.vassals?K.vassals.reduce((a,v)=>a+v.power*2,0):0,trib=K.realms?Object.values(K.realms).filter(r=>r.st==='vassal').reduce((a,r)=>a+r.provs*20,0):0;
  const tskill=K.council?(K.council.treas.skill-50)/250:0;
  const inc=Math.round((c.net*(1+(K.provs-3)*.15)+vas+trib)*(1+tskill)),up=upkeep(K);
  K.treas+=inc-up;
  const fp=18+K.provs*5+(D&&D.built.granary?12:0)-(K.war?6:0),fn=foodNeed(K);K.food=Math.min(200,K.food+fp-fn);
  let msg=`Ngân khố: thu ${inc} xu, quân phí ${up} xu, còn ${K.treas} xu. Lương thực ${K.food}.`;
  if(K.treas<0){K.morale=Math.max(0,K.morale-15);if(!S.pend.includes('k_pay'))S.pend.push('k_pay')}
  if(K.food<0){K.food=0;K.morale=Math.max(0,K.morale-12);if(!S.pend.includes('k_famine'))S.pend.push('k_famine')}
  if(K.drill){K.drill.left--;if(K.drill.left<=0){const T=TRAIN[K.drill.k];if(T.xp)K.xp=Math.min(T.cap,Math.round((K.xp+T.xp)*100)/100);if(T.b)K.bon[T.b]=Math.min(3,(K.bon[T.b]||0)+1);if(T.mor)K.morale=Math.min(100,K.morale+T.mor);msg+=` Hoàn tất chương trình "${T.n}".`;K.drill=null}}
  K.morale=Math.round(Math.max(0,Math.min(100,K.morale+(65-K.morale)*.15+(K.war?-3:0))));
  const base=(D?D.sat:55)*.5+K.legit*.3+vasLoy(K)*.2-(K.war?8:0);K.stab=Math.round(K.stab+(base-K.stab)*.3);
  if(K.realms){
    K.legit=Math.round(Math.max(0,Math.min(100,K.legit+(60-K.legit)*.08+(S.st.honor-50)/40)));
    for(const v of K.vassals){v.loy=Math.round(Math.max(0,Math.min(100,v.loy+R(-4,3)+(K.legit-55)/25)))}
    for(const[n,r]of Object.entries(K.realms)){if(r.st==='annexed')continue;r.rel=Math.max(-100,Math.min(100,r.rel+R(-4,4)));r.power=Math.max(5,Math.round(r.power+R(-1,2)));
      if(!K.war&&r.st==='neutral'&&r.rel<-45&&realmPow(n)>kdPower()*1.1&&ch(.15)){K.war={t:n,score:0,yrs:0,siege:0,def:1,strat:'defend'};log(`${n} tuyên chiến với bạn!`,'bad');announce('Chiến tranh!',`${r.ruler} của ${n} xua quân vượt biên giới. Vương quốc phải cầm vũ khí.`,'banner')}
      if(r.st==='vassal'&&r.rel<-20&&ch(.2)&&!S.pend.includes('k_secede')){K.sec=n;S.pend.push('k_secede')}
    }
    if((vasLoy(K)<35||K.legit<30)&&!K.tw&&ch(.3)){K.tw=1;S.pend.push('k_tw1')}
    else if(K.tw>=1&&K.tw<4&&!S.pend.some(x=>/^k_tw/.test(x)))S.pend.push('k_tw'+(K.tw+1));
  }
  if(K.war){K.war.yrs++;S.pend.push('k_war')}
  log(msg,K.treas<0||K.food===0?'bad':'');
  const kevs=[];
  if(K.realms){
    if(K.gen&&K.gen.loy<35&&K.gen.wins>=2)kevs.push('k_general');
    if(K.war&&K.war.yrs>=3&&K.morale<45)kevs.push('k_desert');
    if(K.war&&K.war.yrs>=2)kevs.push('k_peaceoffer');
    if(K.war&&ch(.25))kevs.push('k_dragon');
    if(upkeep(K)>=180)kevs.push('k_embezzle');
    if(troops(K)>=25&&K.food<30)kevs.push('k_campplague');
    if(K.treas<120)kevs.push('k_counciltax');
    if(K.legit<40)kevs.push('k_pretender');
    if(kids().some(k=>k.sex==='m'&&k.age>=16&&k.age<=40)&&K.war)kevs.push('k_prince');
    if(K.war&&K.realms[K.war.t]&&K.realms[K.war.t].faith==='holy')kevs.push('k_church');
  }
  if(kevs.length&&ch(.55)){const e=pick(kevs);if(!S.evLast)S.evLast={};if(!(S.evLast[e]&&S.year-S.evLast[e]<5)){S.evLast[e]=S.year;S.pend.push(e)}}
}
function battle(strat){
  const K=S.kd,W=K.war,r=K.realms[W.t],St=STRATS[strat];W.strat=strat;
  const ally=Object.values(K.realms).filter(x=>x.st==='ally').reduce((a,x)=>a+x.power*.3,0)+(K.levy||0);K.levy=0;
  const our=kdPower(ally)*St.a*(.8+Math.random()*.4)*(W.def?1.15:1),their=realmPow(W.t)*(.8+Math.random()*.4)/St.d;
  const ratio=our/Math.max(1,their);let t='',tone='';
  const lossF=Math.min(.35,(.04+.07/Math.max(.5,ratio))*St.loss),theirLoss=Math.min(.45,(.05+.08*Math.min(ratio,2.5))*St.a);
  const before=troops(K);kdLose(lossF);r.power=Math.max(3,Math.round(r.power*(1-theirLoss)));
  const lost=Math.round((before-troops(K))*100);
  if(ratio>1){const g=Math.round(Math.min(35,15*ratio*St.a));W.score=Math.min(100,W.score+g);K.xp=Math.min(3,Math.round((K.xp+.15)*100)/100);K.morale=Math.min(100,K.morale+6);t=`Quân ta thắng trận ở ${pick(['đồng cỏ Mây Bay','bờ sông Đá Xám','đèo Gió Bấc','rừng Sồi Đen','thung lũng Chuông'])}. Thiệt hại ${lost} quân. Điểm chiến tranh ${W.score}.`;tone='good';if(K.gen&&K.lead==='gen')K.gen.wins++;if(lossF>.25)S.pend.push('k_bloody')}
  else{const g=Math.round(Math.min(25,9/Math.max(.35,ratio)));W.score=Math.max(-100,W.score-g);K.morale=Math.max(0,K.morale-8);t=`Quân ta bại trận, mất ${lost} quân. Điểm chiến tranh ${W.score}.`;tone='bad'}
  if(St.siege){W.siege+=Math.round(10+K.army.sie*12+K.bon.sie*10+ratio*10);K.food-=8;if(W.siege>=100){W.siege=0;r.provs--;K.provs++;W.score=Math.min(100,W.score+20);t+=` Vây hãm thành công: chiếm được một tỉnh của ${W.t}!`;tone='good'}else t+=` Tiến độ vây thành ${W.siege}/100.`}
  if(St.raid){if(ch(.35)){kdLose(.08);t+=' Đoàn đột kích bị phục kích!';tone='bad'}else{K.food+=15;K.treas+=R(30,80);r.power=Math.max(3,r.power-2);t+=' Đoàn đột kích đốt kho lương địch, mang về chiến lợi phẩm.'}}
  if(K.lead==='king'&&S.age>=16){if(ch(.08)){mod({health:-R(15,30)});t+=' Bạn bị thương khi xông pha trận mạc.'}if(ch(.015)){die('tử trận khi thân chinh');return[t,'bad']}if(ratio>1){mod({honor:3});S.house.prestige+=15}}
  if(r.provs<=0||W.score>=100){S.pend.push('k_victory')}else if(W.score<=-100){S.pend.push('k_defeat')}
  return[t,tone];
}
function endWar(msg){const K=S.kd;K.war=null;return msg}
function declareWar(n){
  const K=S.kd,r=K.realms[n];S.done.kwar=1;
  const cb=r.rel<0;if(!cb){K.legit=Math.max(0,K.legit-12);mod({honor:-6})}
  r.rel=Math.max(-100,r.rel-40);for(const x of Object.values(K.realms))if(x!==r&&x.st!=='annexed')x.rel-=5;
  K.war={t:n,score:0,yrs:0,siege:0,def:0,strat:'careful'};
  log(`Bạn tuyên chiến với ${n}${cb?' để đòi lại đất đai bị chiếm':' mà không có chính danh'}.`,'bad');S.pend.push('k_warplan');afterSheetAction();
}

    if(S.world.cat&&S.world.cat.id!=='player'&&ch(.4))S.pend.push('ac_cat');
    if(!A.q.fire&&ch(.03))S.pend.push('ac_fire');

 {id:'acl1',ac:1,w:W(4),c:s=>isStu(s)&&roomies().length,title:'Bạn cùng phòng ngủ ngáy',text:s=>`${roomies()[0].first} ngáy như sấm suốt đêm. Bạn đã ba đêm không ngủ được.`,

 {id:'acl2',ac:1,w:W(3),c:XAC,title:'Thư tình gửi nhầm',text:'Một lá thư tình viết bằng mực hồng được nhét nhầm vào ngăn bàn của bạn. Tên người nhận bị nhòe.',
  ch:[{t:'Tìm người nhận thật',f:s=>{acc('rep',3);mod({happy:2});return['Bạn trả lá thư cho đúng người. Hai người ấy cảm ơn bạn suốt cả năm.','good']}},{t:'Đọc to giữa lớp',f:s=>{acc('rep',-4);addEnemy('Người viết thư tình bị bạn đọc to giữa lớp',{age:s.age,hate:R(40,55)});return['Cả lớp cười ồ. Người viết thư thì không.','bad']}},{t:'Viết thư hồi âm',f:s=>{if(canLove()&&!lover()&&ch(.4)){const c=cand();s.rel.push(npc('lover',{...c,age:s.age,bond:R(55,70)}));return['Một mối tình học trò bắt đầu từ sự nhầm lẫn.','good']}return'Không ai trả lời thư của bạn.'}}]},

 {id:'acl5',ac:1,w:W(3),c:s=>isStu(s)&&s.race!=='human',title:'Lời kỳ thị',text:s=>`Một nhóm học viên con người chặn bạn ở hành lang: "${RACES[s.race].n} cũng đòi học ở đây à?"`,

 {id:'acb1',queued:true,big:true,art:'enemy',c:XAC,title:'Kẻ bắt nạt Cedric',text:'Cedric, con trai một bá tước, dồn một học viên thường dân vào góc tường, ép nộp tiền ăn.',

function acExam(k){
  const A=S.ac,c=A.cls||'mix',ex=A.ex||'atk';A.ex=null;
  const best={atk:'dodge2',def:'atk2',dodge:'def2'}[ex];
  const st=c==='mage'?S.hid.arcane:c==='sage'?S.st.smarts:c==='guard'?S.st.health:c==='sword'?S.hid.sword:Math.max(S.hid.arcane,S.hid.sword);
  let sc;if(k==='cheat'){if(ch(.55)){sc=70+R(0,15);acc('disc',-6)}else{sc=10;acc('disc',-20);acc('rep',-8)}}
  else sc=Math.round(A.grade*.5+st*.3+R(0,20)+(k===best?15:-5)-(A.off?5:0)-(A.stress>70?8:0));
  sc=Math.max(0,Math.min(100,sc));A.scores.push(sc);A.grade=Math.round(A.grade*.6+sc*.4);
  if(sc>=80){acc('rep',5);if(ch(.3)){S.money+=15;return[`Bạn đạt ${sc} điểm, đứng đầu khóa và nhận học bổng 15 xu.`,'good']}}
  const t=k==='cheat'&&sc===10?'Bạn bị bắt quả tang gian lận. Bài thi bị hủy.':`Bạn đạt ${sc} điểm${k===best?', đúng cách giải mà giám khảo mong đợi':''}. Học lực hiện tại: ${A.grade}.`;
  return[t,sc>=60?'good':sc<40?'bad':''];
}
function acGrad(){const A=S.ac;A.st='grad';A.rank=acRank(A.final);A.gy=S.year;mod({smarts:5});S.house.prestige+=A.rank==='Xuất sắc'?60:A.rank==='Giỏi'?30:10;for(const r of roomies())r.room=0;log(`Bạn tốt nghiệp Học viện Tháp Bạc, xếp loại ${A.rank}.`,'good')}

const BUDP={bal:{n:'Cân bằng',d:'Không lệch bên nào'},res:{n:'Ưu tiên nghiên cứu',d:'Dễ có phát minh · chất lượng dạy giảm nhẹ'},schol:{n:'Ưu tiên học bổng',d:'Ít học viên bỏ học · uy tín tăng'},eq:{n:'Ưu tiên thiết bị',d:'Ít tai nạn'},teach:{n:'Ưu tiên giảng dạy',d:'Uy tín giảng dạy tăng mỗi năm'}};
function staffYear(){
  if(!isStaff(S))return;const A=S.ac;staffHire();
  if(A.bud==='teach')A.tr=Math.min(100,A.tr+3);if(A.bud==='schol')A.tr=Math.min(100,A.tr+1);
  if(S.job.rank>=1&&A.bud!=='eq'&&ch(.08)){A.tr=Math.max(0,A.tr-6);log('Thiếu thiết bị, một học viên bị thương trong phòng thực hành. Bộ môn bị khiển trách.','bad')}
  for(const m of A.men){if(m.fate)continue;m.y++;m.tal=Math.min(100,m.tal+R(0,2));m.bond=clamp(m.bond-R(0,3));if(m.y>=4&&!S.pend.includes('st_mentee')){A.menF=m.id;S.pend.push('st_mentee')}}
  if(S.job.rank===1&&ch(.3))S.pend.push(pick(['st_fraud','st_rival']));
  if(S.job.rank===2&&ch(.3))S.pend.push('st_missing');
  if(S.job.rank===2&&A.tr>=80&&S.job.ry>=4&&!S.pend.includes('st_pvote'))S.pend.push('st_pvote');
  if(S.job.rank===3)schYear();
  if(!A.fireY||S.year-A.fireY>=10){if(ch(.03+(S.sch?S.sch.forb/400+(50-S.sch.sec)/500:0))){A.fireY=S.year;S.pend.push('ac_fire')}}
}

const SCHB={dorm:{n:'Ký túc xá mới',c:150,d:'Chất lượng +3',fx:{qual:3}},arena:{n:'Đấu trường',c:200,d:'Danh tiếng +5',fx:{rep:5}},lib:{n:'Thư viện cổ',c:220,d:'Chất lượng +5',fx:{qual:5}},alch:{n:'Phòng giả kim',c:180,d:'Chất lượng +3, phát minh dễ hơn',fx:{qual:3}},infirm:{n:'Bệnh xá',c:160,d:'Giảm thương vong khi có biến',fx:{sec:4}},obs:{n:'Đài quan sát',c:200,d:'Danh tiếng +4',fx:{rep:4}},ward:{n:'Kết giới bảo hộ',c:260,d:'An ninh +15',fx:{sec:15}}};
function ensureSch(){if(!(isStaff(S)&&S.job.rank===3))return null;if(!S.sch)S.sch={rep:55,qual:55,sec:50,bud:300,cou:60,forb:0,bld:{},adm:'normal',schol:0};return S.sch}
const sc=(k,v)=>{const X=S.sch;X[k]=Math.max(0,Math.min(100,Math.round(X[k]+v)))};
function schYear(){
  const X=ensureSch();if(!X)return;
  const inc=150+X.rep*2+(X.adm==='expand'?80:X.adm==='elite'?-30:0),cost=100+Object.keys(X.bld).length*12+(X.schol?60:0);X.bud+=inc-cost;
  const qt=50+Object.keys(X.bld).length*3+(X.adm==='elite'?8:X.adm==='expand'?-8:0)+(X.schol?4:0)+X.forb/10;X.qual=Math.round(X.qual+(qt-X.qual)*.25);
  X.rep=Math.round(X.rep+(X.qual-X.rep)*.2);X.sec=Math.max(0,X.sec-3);
  X.cou=Math.max(0,Math.min(100,Math.round(X.cou+(X.bud<0?-10:2)-(X.forb>=40?5:0)+(X.rep-55)/15)));
  log(`Học viện Tháp Bạc: ngân sách ${X.bud} xu (thu ${inc}, chi ${cost}). Danh tiếng ${X.rep}, chất lượng ${X.qual}, an ninh ${X.sec}, Hội đồng ủng hộ ${X.cou}.`,X.bud<0||X.cou<30?'bad':'');
  if(X.cou<25&&!S.pend.includes('st_noconf'))S.pend.push('st_noconf');
  if(X.forb>=50&&ch(.3))S.pend.push('st_church');
}

function schAct(s){
  const[a,arg]=s.split(':'),X=ensureSch();S.done['sc_'+a]=1;let t='',tone='';
  if(a==='adm'){X.adm=arg;if(arg==='expand')X.bud+=80;t=`Bạn đặt chỉ tiêu tuyển sinh: ${SCHA.adm.sub[arg].split(' ·')[0].toLowerCase()}.`}
  if(a==='schol'){X.schol=X.schol?0:1;t=X.schol?'Bạn lập quỹ học bổng cho học viên thường dân.':'Bạn bãi bỏ quỹ học bổng.';if(X.schol)sc('rep',3)}
  if(a==='hunt'){X.bud-=80;sc('sec',12);t='Một tổ đội thợ săn hạng A đóng quân trong trường.'}
  if(a==='forb'){X.forb=Math.min(100,X.forb+15);sc('qual',6);sc('cou',-3);t='Bạn mở khóa tầng sách cấm cho nhóm nghiên cứu bí mật.';tone='magic'}
  if(a==='council'){sc('cou',R(6,12));t='Bạn thuyết phục Hội đồng bằng những con số và một bữa tiệc ngon.'}
  if(a==='build'){const B=SCHB[arg];X.bud-=B.c;X.bld[arg]=S.year;for(const[k,v]of Object.entries(B.fx))sc(k,v);t=`Học viện xây xong ${B.n.toLowerCase()}.`;tone='good'}
  if(a==='dip'){if(arg==='royal'){X.bud+=120;sc('cou',-3);t='Hoàng gia tài trợ 120 xu, đổi lại muốn gửi gắm vài con cháu quý tộc.'}if(arg==='church'){X.bud+=60;sc('sec',5);t='Giáo hội tài trợ khoa Thánh thuật.'}if(arg==='guild'){sc('sec',10);t='Hiệp hội Thợ săn cử người huấn luyện đội bảo vệ.'}if(arg==='tower'){sc('qual',5);t='Tháp Ma Pháp đồng ý trao đổi giảng viên.'}tone='good'}
  log(t,tone);note={t,tone};afterSheetAction();
}

function hnBoard(){const H=HN();if(!H.board||H.by!==S.year){H.by=S.year;H.n=0;const g=hnG();const pool=HJOBS.map((j,i)=>i).filter(i=>HJOBS[i][0]<=g&&HJOBS[i][0]>=g-1);const b=pool.sort(()=>Math.random()-.5).slice(0,3);if(g>=1&&!(H.gob&&H.gob.done===S.year)&&!(H.gob&&H.gob.st))b.push('gob');if(g>=2)b.push('crypt');H.board=b}return H.board}
function hnTake(x){const H=HN();if(x==='crypt'){view='hn:party';note=null;drawSheet();return}H.n++;H.board=H.board.filter(b=>String(b)!==String(x));if(x==='gob'){H.gob={st:1,var:(r=>r<.5?'raid':r<.75?'flee':r<.9?'aldric':'sorc')(Math.random()),clues:[],inv:2,reward:55,prep:0,milit:0,info:0,hp:3,host:2};S.pend.push('hg1')}else if(x==='crypt'){view='hn:party';note=null;drawSheet();return}else{H.cur=+x;S.pend.push('hn_job')}afterSheetAction()}
function hnJobRes(kind){
  const H=HN(),J=HJOBS[H.cur],g=hnG();let p,mul=1;
  if(kind==='fight')p=.45+S.hid.sword/250+cbB()/180+S.st.health/500-J[0]*.06+g*.05;
  else if(kind==='plan'){p=.55+S.st.smarts/300-J[0]*.05+g*.05;mul=.9}
  else{p=.75;mul=.5}
  if(ch(p)){const m=Math.round(J[3]*mul),c=Math.round(J[4]*mul);S.money+=m;H.merit+=c;H.q++;mod({honor:2+J[0]});if(J[0]>=2&&ch(.25))gainItem(pick(J[0]>=3?['scale','greatsword','plate','sc_crystal']:['halberd','kite_shield','greathelm','gem']));if(J[0]>=3)H.boss++;if(J[0]===4){S.flags.dragonslayer=1;H.trial=Math.max(H.trial,2)}return[`${J[1]}: hoàn thành. Bạn nhận ${m} xu và ${c} công trạng (tổng ${H.merit}).`,'good']}
  if(kind==='flee')return[`${J[1]}: bạn rút lui, không nhận được gì.`,''];
  const d=R(8,18)+J[0]*5;mod({health:-d});if(ch(J[5]*.4)){die(`trong ủy thác "${J[1]}"`);return['Con quái vật mạnh hơn mọi lời đồn.','bad']}return[`${J[1]}: thất bại, bạn mất ${d} sức khỏe.`,'bad'];
}
function hnYear(){
  if(!isHn(S))return;const H=HN();
  if(hnCanUp())hnPromote();
  else if(hnG()===1&&H.merit>=350&&H.q>=10&&!H.trial&&!S.pend.includes('hn_trial'))S.pend.push('hn_trial');
  else if(hnG()===3&&H.merit>=2000&&H.trial<2&&!S.pend.includes('hn_strial'))S.pend.push('hn_strial');
  if(hnG()>=3&&S.world.cat&&S.world.cat.id!=='player'&&!S.flags.hero&&ch(.5))S.pend.push('hn_invite');
  if(H.spared&&!H.sparedDone&&S.year-H.spared>=3&&ch(.4)){H.sparedDone=1;S.pend.push('hn_gobgift')}
  if(H.dgB&&!H.dgBDone&&S.year-H.dgB>=2&&ch(.35)){H.dgBDone=1;S.pend.push('hn_borin')}
}

function gobEnd(out){
  const G=gob(),H=HN();const T={kill:[55,35,'Diệt bầy, cứu con tin. Làng đã an toàn.'],leader:[40,25,'Bạn hạ được thủ lĩnh, nhưng phần còn lại của bầy trốn thoát.'],peace:[45,35,'Bạn đạt được thỏa thuận hòa bình với bầy Goblin.'],expose:[20,40,'Bạn vạch trần âm mưu của trưởng làng Aldric.'],sorc:[55,50,'Bạn phá tà thuật và giải thoát bầy Goblin.'],flee:[0,0,'Bạn rút lui. Làng vẫn sống trong sợ hãi.'],fail:[0,0,'Ủy thác thất bại.']}[out];
  let money=out==='kill'||out==='sorc'?Math.max(T[0],G.reward):T[0];if(out==='kill'&&G.host<2)money=Math.round(money*.8);
  S.money+=money;H.merit+=T[1];if(T[1])H.q++;G.st=0;G.done=S.year;G.out=out;
  if(out==='kill'||out==='sorc'||out==='peace')mod({honor:5});
  if(out==='peace')H.spared=S.year;if(out==='sorc')H.sorc=1;
  log(`Ủy thác "Bóng xanh dưới chân đồi": ${GVAR[G.var].toLowerCase()}.`,'');

}

  if(ch(p)){const dmg=kind==='power'||kind==='leader'?2:1;G.hp-=dmg;t=kind==='leader'?'Bạn lao thẳng vào Goblin giáp đỏ và chém trúng vai nó.':kind==='magic'?'Ngọn lửa của bạn thiêu cháy hàng rào trại.':'Đòn của bạn trúng đích.';tone='good';
    if(G.hp<=0){return gobEnd(kind==='leader'&&G.host<2?'leader':'kill')}

}

function dBoss(a){
  const d=D();let t='';let dmg=0;

  if(a==='snipe'){const ok=d.ph===3&&(d.weak||d.name);dmg=ok?Math.round(R(20,30)*sk('s')/80):Math.round(R(4,8)*sk('s')/80);t=ok?`${pm('s',d.s).n} bắn vỡ viên ngọc trên vương miện của Boss! Phòng thủ của nó sụp đổ.`:`${pm('s',d.s).n} bắn một mũi tên vào khe giáp.`}

  if(a==='purge'){d.mp-=25;d.curse=0;t=`${pm('h',d.h).n} thanh tẩy lời nguyền khỏi tổ đội.`}
  if(a==='pot'){d.pot--;d.hp=Math.min(100,d.hp+25);t='Bạn chuyền thuốc hồi phục cho cả đội.'}
  d.boss=Math.max(0,d.boss-dmg);if(dmg)t+=` Boss còn ${d.boss}/100 sinh lực.`;
  if(d.boss<=0){d.end='conquer';S.pend.push('hdend');return[t+' Vua Không Ngai sụp đổ thành tro bụi.','good']}
  d.ph=d.boss>65?1:d.boss>30?2:3;
  let bd=R(8,15)+(d.buff?4:0)+(d.ph===1&&!alive('s')?4:0);if(d.guard&&alive('t'))bd=Math.round(bd*(1-sk('t')/140));d.guard=0;
  t+=dHit(bd,'trước kiếm nguyền');if(d.ph>=2&&d.curse)t+=dHit(6,'vì lời nguyền');if(d.ph===2&&!d.curseCast){d.curseCast=1;d.curse=1;t+=' Boss thi triển lời nguyền lên cả đội!'}

}

}

/* ---------- migration & events ---------- */
function migrate(s){
  if(!s)return null;
  if(s.v===4)return s;
  const r=migrate0(s);if(r&&r.v===3){const m=t=>t>=3?t+1:t;r.house.title=m(r.house.title);(r.tree||[]).forEach(g=>g.title=m(g.title));r.v=4}return r;
}
function migrate0(s){
  if(s.v===3)return s;
  if(s.v===2)return mig3(s);
  if(s.v!==1)return null;
  s.race=s.race||'human';if(s.st.magic==null)s.st.magic=R(5,30);
  s.fam.forEach(p=>{if(!p.race)p.race=s.race});
  s.house=newHouse(s.surname,s.by);if(s.flags.king)s.house.title=6;else if(s.cls==='noble')s.house.title=2;
  s.tree=[];s.bag=[];s.ann=[];s.flags.her=s.flags.her||0;
  s.spHist=s.fam.filter(p=>p.rel==='Vợ'||p.rel==='Chồng').map(p=>p.name);
  const p0=s.fam.filter(p=>p.rel==='Cha'||p.rel==='Mẹ');if(p0.length)s.roots=p0.map(p=>p.name).join(' và ');
  for(const k of ['wand','tome'])if(s.own[k]){for(let i=0;i<s.own[k];i++)s.bag.push({id:uid(),k,origin:`Đời 1 · ${s.first}`});delete s.own[k]}
  delete s.own.elixir;
  s.v=2;return mig3(s);
}
function mig3(s){if(!s.hid)s.hid=newTalents(s.race);if(!s.world)s.world={cat:null,last:s.year-8};if(!REALMS.includes(s.realm))s.realm=pick(REALMS);s.v=3;return s}
document.addEventListener('click',e=>{
  if(e.target.id==='sheet'){closeSheet();return}
  const b=e.target.closest('button');if(!b||b.disabled)return;const d=b.dataset;
  if(d.open){if(d.open!=='bag')sel=null;if($('#sheet').hidden||!view)openSheet(d.open);else{if(d.open!==view)note=null;view=d.open;drawSheet()}}
  else if(d.x)extAct2(d.x);
  else if('close'in d)closeSheet();
  else if('age'in d)ageUp();
  else if(d.ec!==undefined)choose(+d.ec);
  else if('next'in d)showNext();
  else if('annok'in d){S.ann.shift();save();showNext()}
  else if(d.act)doAct(d.act);
  else if(d.job)joinJob(d.job);
  else if('quit'in d)quitJob();
  else if(d.p){note=null;view='p:'+d.p;drawSheet()}
  else if(d.r){note=null;view='r:'+d.r;drawSheet()}
  else if(d.ra)relAct(d.ra);
  else if(d.dom)domAct(d.dom);
  else if('dpet'in d)petition();
  else if(d.flirt!==undefined)flirt(+d.flirt);
  else if('findf'in d)findFriend();
  else if(d.pa)personAct(d.pa);
  else if('match'in d){note=null;view='match';drawSheet()}
  else if(d.wed!==undefined)wed(+d.wed);
  else if('baby'in d)baby();
  else if(d.buy)buyAsset(d.buy);
  else if(d.sell)sellAsset(d.sell);
  else if(d.shop)buyShop(d.shop);
  else if(d.crest){const[k,v]=d.crest.split('|');S.house[k]=v;if(k==='c1'&&S.house.c2===v)S.house.c2=METAL.find(m=>m!==v);save();render();drawSheet()}
  else if('motto'in d){const v=($('#motto').value||'').trim();if(v){S.house.motto=v;save()}note={t:'Đã lưu châm ngôn mới.',tone:'good'};drawSheet()}
  else if(d.sel){sel=sel===d.sel?null:d.sel;note=null;drawSheet()}
  else if(d.use)useItem(d.use);
  else if(d.sellit)sellItem(d.sellit);
  else if(d.heir)inherit(d.heir);
  else if('openHouse'in d){closeModal();view='house';note=null;drawSheet();$('#sheet').hidden=false}
  else if('confirm'in d){view='confirm';drawSheet()}
  else if('new'in d){closeModal();restart()}
  else if(d.sex||d.race){const was=draft.name,wasList=nameList(draft.sex,draft.race),wasH=(RSUR[draft.race]||SUR[draft.cls]).includes(draft.house);readName();if(d.sex)draft.sex=d.sex;if(d.race){draft.race=d.race;if(wasH)draft.house=surFor(d.race,draft.cls)}if(draft.name===was&&wasList.includes(was))draft.name=pick(nameList(draft.sex,draft.race));renderIntro()}
  else if(d.cls){readName();const L0=RSUR[draft.race]||SUR[draft.cls];const wasDef=L0.includes(draft.house);draft.cls=d.cls;if(wasDef)draft.house=surFor(draft.race,d.cls);renderIntro()}
  else if('rehouse'in d){readName();draft.house=pick(RSUR[draft.race]||[...SUR[draft.cls],'Blackthorn','Stormvale','Ravencrest','Ashborne','Wolfsbane','Silverbrook']);renderIntro()}
  else if('randall'in d){draft=randDraft();renderIntro()}
  else if('reroll'in d){draft.name=pick(nameList(draft.sex,draft.race));renderIntro()}
  else if('born'in d){readName();const n=draft.name.trim()||pick(nameList(draft.sex,draft.race));closeModal();newLife({name:n,sex:draft.sex,cls:draft.cls,race:draft.race,house:draft.house})}
});
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'){if(e.key==='Enter'&&e.target.id==='motto')$('[data-motto]').click();return}
  if(e.key==='Escape'&&!$('#sheet').hidden){closeSheet();return}
  if(!$('#modal').hidden||!S)return;
  const h=HOT.find(x=>x[3]===e.key);
  if(h){openSheet(h[0]);return}
  if(e.key===' '&&$('#sheet').hidden){e.preventDefault();ageUp()}
});
